name: Docker Build and Push

on:
  push:
    tags:
      - 'spark-v*'

# Default to read-only; the job below grants packages: write explicitly.
permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - keycloak-21.1.2
          - keycloak-postgres-query
          - kong-api-scripts
          - sunbird-yugabyte-migrations
          - janusgraph
          - yugabyte-backup
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner and generate tag
        id: prep
        run: |
          echo "OWNER_LOWERCASE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # Format: spark-v<tag>_<short-sha> e.g. spark-v1.0.2_abc1234
          GIT_TAG="${GITHUB_REF_NAME}"
          RAW_TAG="${GIT_TAG}_${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$(echo "$RAW_TAG" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/${{ matrix.directory }}
          file: ./scripts/${{ matrix.directory }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.OWNER_LOWERCASE }}/${{ matrix.directory }}:${{ steps.prep.outputs.IMAGE_TAG }}
            ghcr.io/${{ steps.prep.outputs.OWNER_LOWERCASE }}/${{ matrix.directory }}:latest
