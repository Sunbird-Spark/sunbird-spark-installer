name: Bug report
description: An install, upgrade or deployment step isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please don't report security vulnerabilities here.** Follow
        [SECURITY.md](https://github.com/Sunbird-Spark/sunbird-spark-installer/blob/main/SECURITY.md)
        and use private vulnerability reporting.

        **Redact before you paste:** subscription and account IDs, domains, certificates,
        API tokens, and anything from a filled-in `global-values.yaml`.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this isn't already reported
          required: true
        - label: I've checked the prerequisites in the README — SSL fullchain, OAuth and ReCaptcha credentials, and the required CLI tools at the right versions
          required: true

  - type: dropdown
    id: provider
    attributes:
      label: Cloud provider
      options:
        - Azure
        - AWS
        - GCP
        - Affects more than one
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options:
        - Provisioning infrastructure (OpenTofu / Terragrunt)
        - Installing charts (Helm)
        - A specific service failing to start
        - Keycloak, Kong or authentication
        - SSL certificates
        - Databases (YugabyteDB, Redis, Elasticsearch, JanusGraph)
        - Flink jobs
        - Monitoring stack
        - Backup / Velero
        - Upgrade of an existing install
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: Fresh install or existing cluster?
      options:
        - Fresh install
        - Upgrade of an existing install
        - Re-run after a partial failure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what actually happened, and which step you were on.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: OpenTofu, Terragrunt, kubectl, helm, and the branch or tag of this repository.
      placeholder: |
        OpenTofu: 1.11.4
        Terragrunt: 0.77.5
        Repository: v1.1.1
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Which addons are enabled, whether the cluster is private, and VPN or Bastion access. Don't paste credentials.

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The failing command and its output. Redact identifiers first.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: contributing
    attributes:
      label: Would you like to work on this?
      options:
        - I'd like to fix it myself
        - I'd like guidance before trying
        - I'm only reporting it
    validations:
      required: true