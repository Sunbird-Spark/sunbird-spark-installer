# SonarCloud analysis config (see .github/workflows/sonarcloud.yml).
sonar.projectKey=Sunbird-Spark_sunbird-spark-installer
sonar.organization=sunbird-spark
sonar.sources=.

# Vendored/third-party code and static content — not maintained by this
# team, re-vendored wholesale on upgrade, and shouldn't count against our
# ratings. Confirmed via SonarCloud's own issue directory facets
# (2026-08-26 scan): these paths account for the large majority of the
# current Security/Reliability issue count.
sonar.exclusions=\
  scripts/keycloak-21.1.2/themes/**,\
  helmcharts/additional/charts/nlweb/static/**,\
  public-artifacts/**,\
  helmcharts/monitoring/charts/kube-prometheus-stack/**,\
  helmcharts/monitoring/charts/kubernetes-dashboard/**,\
  helmcharts/monitoring/charts/loki/**,\
  helmcharts/monitoring/charts/alloy/**,\
  helmcharts/monitoring/charts/reloader/**,\
  helmcharts/additional/charts/velero/**,\
  helmcharts/obsrvbb/charts/superset/**,\
  helmcharts/learnbb/charts/keycloak/**,\
  helmcharts/learnbb/charts/opensearch/**,\
  helmcharts/knowledgebb/charts/opensearch/**,\
  **/*.tgz

# scripts/keycloak-21.1.2/{conf,imports,providers,Dockerfile} are NOT
# excluded above — that's our realm/client setup, not vendor theme assets.
# migration/database/import/files/** is NOT excluded — real first-party
# migration scripts (verified: add_user_createdat_field.py,
# cassandra-to-yugabyte.py, neo4j-to-janusgraph.py, etc.), not vendored data.

sonar.test.inclusions=**/tests/**,**/*_test.py,**/test_*.py
