name: Spark Platform Addons

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (must match folder name in configs/)'
        required: true
        type: choice
        options:
          - <env>   # Replace with your environment name (e.g. dev, prod, staging)
        default: <env>
      config_branch:
        description: 'Config repository branch (your private repo)'
        required: true
        type: string
        default: main
      source_branch:
        description: 'Source repository branch (sunbird-spark-installer - public)'
        required: true
        type: string
        default: main

      # ── INFRA ADDONS — DIAL OpenTofu ─────────────────────────────────
      run_dial_infra:
        description: '1️⃣ Run DIAL addon OpenTofu (storage container provisioning)'
        type: boolean
        default: false

      # ── DEPLOY ADDONS ────────────────────────────────────────────────
      run_addon_components:
        description: '2️⃣ Deploy addon components'
        type: boolean
        default: false
      addon_dial:
        description: '   ↳ DIAL'
        type: boolean
        default: false
      addon_discussion_forum:
        description: '   ↳ Discussion Forum'
        type: boolean
        default: false
      addon_video_stream_generator:
        description: '   ↳ Video Stream Generator'
        type: boolean
        default: false
      addon_asset_enrichment:
        description: '   ↳ Asset Enrichment'
        type: boolean
        default: false

      # ── REMOVE ADDONS ────────────────────────────────────────────────
      run_remove_addon_components:
        description: '3️⃣ Remove addon components (uninstall)'
        type: boolean
        default: false
      remove_addon_dial:
        description: '   ↳ DIAL'
        type: boolean
        default: false
      remove_addon_discussion_forum:
        description: '   ↳ Discussion Forum'
        type: boolean
        default: false
      remove_addon_video_stream_generator:
        description: '   ↳ Video Stream Generator'
        type: boolean
        default: false
      remove_addon_asset_enrichment:
        description: '   ↳ Asset Enrichment'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CONFIG_PATH: "configs/${{ inputs.environment }}"
  ENV_FOLDER: "sunbird-spark-installer/opentofu/azure/${{ inputs.environment }}"

# ════════════════════════════════════════════════════════════════════════════
# JOB 1 — INFRA ADDONS (DIAL OpenTofu)
# ════════════════════════════════════════════════════════════════════════════
jobs:
  infra-addons:
    name: "1 — Infra Addons (DIAL OpenTofu)"
    if: ${{ inputs.run_dial_infra }}
    runs-on: [self-hosted, azure]
    environment: ${{ inputs.environment }}
    permissions:
      contents: write   # Encrypt and Commit Addon Configs pushes to the config repo

    steps:
      - name: Checkout Configuration Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.config_branch }}

      - name: Clone Source Repository
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git clone --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Sunbird-Spark/sunbird-spark-installer.git sunbird-spark-installer
          echo "✅ Cloned source repository (branch: $SOURCE_BRANCH)"


      - name: Decrypt Config Files
        run: |
          pip install --only-binary :all: ansible==14.3.1

          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

          ansible-vault decrypt $CONFIG_PATH/global-values.yaml \
            --vault-password-file=/tmp/vault_pass.txt
          echo "✅ global-values.yaml decrypted"

          if [ -f "$CONFIG_PATH/global-cloud-values.yaml" ]; then
            ansible-vault decrypt $CONFIG_PATH/global-cloud-values.yaml \
              --vault-password-file=/tmp/vault_pass.txt
            echo "✅ global-cloud-values.yaml decrypted"
          fi

          rm /tmp/vault_pass.txt

      - name: Install Terraform Tools
        env:
          TOFU_VERSION: "1.11.4"
        run: |
          TOFU_VERSION="1.11.4"
          curl -sLO --proto '=https' "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -sLO --proto '=https' "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS"
          grep " tofu_${TOFU_VERSION}_linux_amd64.zip$" "tofu_${TOFU_VERSION}_SHA256SUMS" | sha256sum -c -
          sudo unzip -qo tofu_${TOFU_VERSION}_linux_amd64.zip -d /usr/local/bin/
          rm tofu_${TOFU_VERSION}_linux_amd64.zip tofu_${TOFU_VERSION}_SHA256SUMS
          TERRAGRUNT_VERSION="0.77.5"
          curl -sLO --proto '=https' "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          curl -sLO --proto '=https' "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          rm terragrunt_linux_amd64 SHA256SUMS
          YQ_VERSION="4.44.1"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/checksums"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/checksums_hashes_order"
          YQ_SHA256_FIELD=$(($(grep -n '^SHA-256$' checksums_hashes_order | cut -d: -f1) + 1))
          grep '^yq_linux_amd64 ' checksums | awk -v f="$YQ_SHA256_FIELD" '{print $f"  yq_linux_amd64"}' | sha256sum -c -
          sudo install -m 0755 yq_linux_amd64 /usr/local/bin/yq
          rm yq_linux_amd64 checksums checksums_hashes_order
          tofu --version && terragrunt --version && yq --version

      - name: Setup Environment Folder
        run: |
          mkdir -p $ENV_FOLDER
          cp $CONFIG_PATH/global-values.yaml $ENV_FOLDER/global-values.yaml
          if [ -f "$CONFIG_PATH/global-cloud-values.yaml" ]; then
            cp $CONFIG_PATH/global-cloud-values.yaml $ENV_FOLDER/global-cloud-values.yaml
          else
            echo "{}" > $ENV_FOLDER/global-cloud-values.yaml
          fi

      - name: 1️⃣ run_dial_infra
        run: |
          if [ -f "$ENV_FOLDER/tf.sh" ]; then
            source $ENV_FOLDER/tf.sh
          elif [ -f "$CONFIG_PATH/tf.sh" ]; then
            source $CONFIG_PATH/tf.sh
          else
            echo "❌ tf.sh not found — run core infra first"
            exit 1
          fi

          export ENV_NAME="${{ inputs.environment }}"
          export TERRAGRUNT_TFPATH=$(which tofu)

          echo "resource_group_name = \"$AZURE_OPENTOFU_BACKEND_RG\"" > \
            sunbird-spark-installer/addons/dial/opentofu/azure/storage/override.auto.tfvars

          cd sunbird-spark-installer/addons/dial/opentofu/azure
          terragrunt run-all apply --terragrunt-non-interactive
          echo "✅ DIAL addon OpenTofu completed"

      - name: Encrypt and Commit Addon Configs
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

          ADDON_CLOUD="sunbird-spark-installer/addons/global-cloud-values.yaml"
          if [ -f "$ADDON_CLOUD" ]; then
            mkdir -p $CONFIG_PATH/addons
            cp "$ADDON_CLOUD" $CONFIG_PATH/addons/global-cloud-values.yaml
            ansible-vault encrypt $CONFIG_PATH/addons/global-cloud-values.yaml \
              --vault-password-file=/tmp/vault_pass.txt
            echo "✓ Encrypted: addons/global-cloud-values.yaml"
          fi

          rm /tmp/vault_pass.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CONFIG_PATH/addons/
          git commit -m "chore: encrypted addon configs [${{ inputs.environment }}] [skip ci]" \
            || echo "No changes to commit"
          git push || echo "Push failed or no changes"
          echo "✅ Addon configs committed"

      - name: Infra Addons Summary
        if: always()
        run: |
          echo "================================================"
          echo "     INFRA ADDONS SUMMARY"
          echo "================================================"
          echo "Environment : ${{ inputs.environment }}"
          [ "${{ inputs.run_dial_infra }}" == "true" ] && echo "  ✅ 1️⃣  DIAL OpenTofu" || echo "  ⏭️  1️⃣  DIAL OpenTofu (skipped)"
          echo "================================================"

# ════════════════════════════════════════════════════════════════════════════
# JOB 2 — DEPLOY ADDONS (DIAL, Discussion Forum, Video Stream Generator)
# ════════════════════════════════════════════════════════════════════════════
  deploy-addons:
    name: "2 — Deploy Addons"
    if: ${{ always() && inputs.run_addon_components }}
    needs: [infra-addons]
    runs-on: [self-hosted, azure]
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Configuration Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.config_branch }}

      - name: Clone Source Repository
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git clone --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Sunbird-Spark/sunbird-spark-installer.git sunbird-spark-installer
          echo "✅ Cloned source repository (branch: $SOURCE_BRANCH)"


      - name: Decrypt Config Files
        run: |
          pip install --only-binary :all: ansible==14.3.1

          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

          ansible-vault decrypt $CONFIG_PATH/global-values.yaml \
            --vault-password-file=/tmp/vault_pass.txt
          echo "✅ global-values.yaml decrypted"

          if [ -f "$CONFIG_PATH/global-cloud-values.yaml" ]; then
            ansible-vault decrypt $CONFIG_PATH/global-cloud-values.yaml \
              --vault-password-file=/tmp/vault_pass.txt
            echo "✅ global-cloud-values.yaml decrypted"
          fi

          if [ -f "$CONFIG_PATH/addons/global-cloud-values.yaml" ]; then
            ansible-vault decrypt $CONFIG_PATH/addons/global-cloud-values.yaml \
              --vault-password-file=/tmp/vault_pass.txt
            if [ -f "sunbird-spark-installer/addons/global-cloud-values.yaml" ]; then
              yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
                sunbird-spark-installer/addons/global-cloud-values.yaml \
                $CONFIG_PATH/addons/global-cloud-values.yaml \
                > /tmp/merged-addon-cloud.yaml
              cp /tmp/merged-addon-cloud.yaml sunbird-spark-installer/addons/global-cloud-values.yaml
              echo "✅ Addon cloud values merged"
            else
              cp $CONFIG_PATH/addons/global-cloud-values.yaml \
                sunbird-spark-installer/addons/global-cloud-values.yaml
              echo "✅ Addon cloud values copied"
            fi
          fi

          rm /tmp/vault_pass.txt

      - name: Setup Environment Folder
        run: |
          cp -r sunbird-spark-installer/opentofu/azure/template $ENV_FOLDER
          cp $CONFIG_PATH/global-values.yaml $ENV_FOLDER/global-values.yaml
          if [ -f "$CONFIG_PATH/global-cloud-values.yaml" ]; then
            cp $CONFIG_PATH/global-cloud-values.yaml $ENV_FOLDER/global-cloud-values.yaml
          else
            echo "{}" > $ENV_FOLDER/global-cloud-values.yaml
          fi
          echo "✅ Environment folder ready: $ENV_FOLDER"

      - name: Install Deploy Tools
        env:
          HELM_VERSION: "3.21.4"
        run: |
          KUBECTL_VER=$(curl -sL --proto '=https' https://dl.k8s.io/release/stable.txt)
          curl -sLO --proto '=https' "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl"
          curl -sLO --proto '=https' "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/ && rm kubectl.sha256
          HELM_VERSION="3.21.4"
          curl -sLO --proto '=https' "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sLO --proto '=https' "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar -xzf "helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm-v${HELM_VERSION}-linux-amd64.tar.gz helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum linux-amd64
          YQ_VERSION="4.44.1"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/checksums"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/checksums_hashes_order"
          YQ_SHA256_FIELD=$(($(grep -n '^SHA-256$' checksums_hashes_order | cut -d: -f1) + 1))
          grep '^yq_linux_amd64 ' checksums | awk -v f="$YQ_SHA256_FIELD" '{print $f"  yq_linux_amd64"}' | sha256sum -c -
          sudo install -m 0755 yq_linux_amd64 /usr/local/bin/yq
          rm yq_linux_amd64 checksums checksums_hashes_order
          kubectl version --client && helm version && yq --version

      - name: Get AKS Credentials
        run: |
          BUILDING_BLOCK=$(yq '.global.building_block' $CONFIG_PATH/global-values.yaml)
          CLUSTER_NAME="${BUILDING_BLOCK}-${{ inputs.environment }}"
          az aks get-credentials \
            --name "$CLUSTER_NAME" \
            --resource-group "$CLUSTER_NAME" \
            --overwrite-existing
          kubectl get nodes
          echo "✅ AKS credentials configured (cluster: $CLUSTER_NAME)"

      - name: 2️⃣ addon — DIAL
        if: ${{ inputs.addon_dial }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/dial/script/addon.sh install azure
          echo "✅ DIAL installed"

      - name: 2️⃣ addon — Discussion Forum
        if: ${{ inputs.addon_discussion_forum }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/discussion-forum/script/addon.sh install azure
          echo "✅ Discussion Forum installed"

      - name: 2️⃣ addon — Video Stream Generator
        if: ${{ inputs.addon_video_stream_generator }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/video-stream-generator/script/addon.sh install azure
          echo "✅ Video Stream Generator installed"

      - name: 2️⃣ addon — Asset Enrichment
        if: ${{ inputs.addon_asset_enrichment }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/asset-enrichment/script/addon.sh install azure
          echo "✅ Asset Enrichment installed"

      - name: Deploy Addons Summary
        if: always()
        run: |
          echo "================================================"
          echo "     DEPLOY ADDONS SUMMARY"
          echo "================================================"
          echo "Environment : ${{ inputs.environment }}"
          [ "${{ inputs.addon_dial }}"                   == "true" ] && echo "  ✅ DIAL"                   || echo "  ⏭️  DIAL (skipped)"
          [ "${{ inputs.addon_discussion_forum }}"       == "true" ] && echo "  ✅ Discussion Forum"       || echo "  ⏭️  Discussion Forum (skipped)"
          [ "${{ inputs.addon_video_stream_generator }}" == "true" ] && echo "  ✅ Video Stream Generator" || echo "  ⏭️  Video Stream Generator (skipped)"
          [ "${{ inputs.addon_asset_enrichment }}"       == "true" ] && echo "  ✅ Asset Enrichment"       || echo "  ⏭️  Asset Enrichment (skipped)"
          echo "================================================"

# ════════════════════════════════════════════════════════════════════════════
# JOB 3 — REMOVE ADDONS (DIAL, Discussion Forum, Video Stream Generator)
# ════════════════════════════════════════════════════════════════════════════
  remove-addons:
    name: "3 — Remove Addons"
    if: ${{ always() && inputs.run_remove_addon_components }}
    needs: [infra-addons, deploy-addons]
    runs-on: [self-hosted, azure]
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Configuration Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.config_branch }}

      - name: Clone Source Repository
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git clone --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Sunbird-Spark/sunbird-spark-installer.git sunbird-spark-installer
          echo "✅ Cloned source repository (branch: $SOURCE_BRANCH)"


      - name: Decrypt Config Files
        run: |
          pip install --only-binary :all: ansible==14.3.1

          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

          ansible-vault decrypt $CONFIG_PATH/global-values.yaml \
            --vault-password-file=/tmp/vault_pass.txt
          echo "✅ global-values.yaml decrypted"

          if [ -f "$CONFIG_PATH/global-cloud-values.yaml" ]; then
            ansible-vault decrypt $CONFIG_PATH/global-cloud-values.yaml \
              --vault-password-file=/tmp/vault_pass.txt
            echo "✅ global-cloud-values.yaml decrypted"
          fi

          if [ -f "$CONFIG_PATH/addons/global-cloud-values.yaml" ]; then
            ansible-vault decrypt $CONFIG_PATH/addons/global-cloud-values.yaml \
              --vault-password-file=/tmp/vault_pass.txt
            if [ -f "sunbird-spark-installer/addons/global-cloud-values.yaml" ]; then
              yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
                sunbird-spark-installer/addons/global-cloud-values.yaml \
                $CONFIG_PATH/addons/global-cloud-values.yaml \
                > /tmp/merged-addon-cloud.yaml
              cp /tmp/merged-addon-cloud.yaml sunbird-spark-installer/addons/global-cloud-values.yaml
              echo "✅ Addon cloud values merged"
            else
              cp $CONFIG_PATH/addons/global-cloud-values.yaml \
                sunbird-spark-installer/addons/global-cloud-values.yaml
              echo "✅ Addon cloud values copied"
            fi
          fi

          rm /tmp/vault_pass.txt

      - name: Setup Environment Folder
        run: |
          cp -r sunbird-spark-installer/opentofu/azure/template $ENV_FOLDER
          cp $CONFIG_PATH/global-values.yaml $ENV_FOLDER/global-values.yaml
          if [ -f "$CONFIG_PATH/global-cloud-values.yaml" ]; then
            cp $CONFIG_PATH/global-cloud-values.yaml $ENV_FOLDER/global-cloud-values.yaml
          else
            echo "{}" > $ENV_FOLDER/global-cloud-values.yaml
          fi
          echo "✅ Environment folder ready: $ENV_FOLDER"

      - name: Install Deploy Tools
        env:
          HELM_VERSION: "3.21.4"
        run: |
          KUBECTL_VER=$(curl -sL --proto '=https' https://dl.k8s.io/release/stable.txt)
          curl -sLO --proto '=https' "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl"
          curl -sLO --proto '=https' "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/ && rm kubectl.sha256
          HELM_VERSION="3.21.4"
          curl -sLO --proto '=https' "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sLO --proto '=https' "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar -xzf "helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm-v${HELM_VERSION}-linux-amd64.tar.gz helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum linux-amd64
          YQ_VERSION="4.44.1"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/checksums"
          curl -sLO --proto '=https' "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/checksums_hashes_order"
          YQ_SHA256_FIELD=$(($(grep -n '^SHA-256$' checksums_hashes_order | cut -d: -f1) + 1))
          grep '^yq_linux_amd64 ' checksums | awk -v f="$YQ_SHA256_FIELD" '{print $f"  yq_linux_amd64"}' | sha256sum -c -
          sudo install -m 0755 yq_linux_amd64 /usr/local/bin/yq
          rm yq_linux_amd64 checksums checksums_hashes_order
          kubectl version --client && helm version && yq --version

      - name: Get AKS Credentials
        run: |
          BUILDING_BLOCK=$(yq '.global.building_block' $CONFIG_PATH/global-values.yaml)
          CLUSTER_NAME="${BUILDING_BLOCK}-${{ inputs.environment }}"
          az aks get-credentials \
            --name "$CLUSTER_NAME" \
            --resource-group "$CLUSTER_NAME" \
            --overwrite-existing
          kubectl get nodes
          echo "✅ AKS credentials configured (cluster: $CLUSTER_NAME)"

      - name: 3️⃣ remove — DIAL
        if: ${{ inputs.remove_addon_dial }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/dial/script/addon.sh uninstall azure
          echo "✅ DIAL uninstalled"

      - name: 3️⃣ remove — Discussion Forum
        if: ${{ inputs.remove_addon_discussion_forum }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/discussion-forum/script/addon.sh uninstall azure
          echo "✅ Discussion Forum uninstalled"

      - name: 3️⃣ remove — Video Stream Generator
        if: ${{ inputs.remove_addon_video_stream_generator }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/video-stream-generator/script/addon.sh uninstall azure
          echo "✅ Video Stream Generator uninstalled"

      - name: 3️⃣ remove — Asset Enrichment
        if: ${{ inputs.remove_addon_asset_enrichment }}
        run: |
          export ENV_NAME="${{ inputs.environment }}"
          bash sunbird-spark-installer/addons/asset-enrichment/script/addon.sh uninstall azure
          echo "✅ Asset Enrichment uninstalled"

      - name: Remove Addons Summary
        if: always()
        run: |
          echo "================================================"
          echo "     REMOVE ADDONS SUMMARY"
          echo "================================================"
          echo "Environment : ${{ inputs.environment }}"
          [ "${{ inputs.remove_addon_dial }}"                   == "true" ] && echo "  ✅ DIAL"                   || echo "  ⏭️  DIAL (skipped)"
          [ "${{ inputs.remove_addon_discussion_forum }}"       == "true" ] && echo "  ✅ Discussion Forum"       || echo "  ⏭️  Discussion Forum (skipped)"
          [ "${{ inputs.remove_addon_video_stream_generator }}" == "true" ] && echo "  ✅ Video Stream Generator" || echo "  ⏭️  Video Stream Generator (skipped)"
          [ "${{ inputs.remove_addon_asset_enrichment }}"       == "true" ] && echo "  ✅ Asset Enrichment"       || echo "  ⏭️  Asset Enrichment (skipped)"
          echo "================================================"
