# CAUTION: velero/janusgraph/knowledgemw are ALSO keys inside internal:
# (merged to root via <<: *internal above). YAML merge-key semantics mean an
# explicit key at the same name completely REPLACES the merged-in one — it
# does NOT deep-merge — so every block below must re-include that internal:
# entry's image/imagePullSecrets alongside whatever new field it's adding, or
# it silently deletes the working override that internal: already provided.
# (Found by testing: after adding these blocks, all three's *main* image
# silently reverted to the vendored chart's own default — velero's shows the
# same as intended only because upstream's own default happens to match.)

# velero.initContainers is a list, which Helm replaces wholesale rather than
# merging by key — replicated in full (unchanged apart from the image alias)
# rather than partially, to avoid silently dropping the other required fields
velero:
  image: *velero
  imagePullSecrets:
    - name: "registry-secret-name"
  initContainers:
    - name: velero-plugin-for-azure
      image: *velero_plugin_azure
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins
  kubectl:
    image: *velero_kubectl

# janusgraph.sidecars is a list, same reasoning as velero.initContainers
# above — replicated in full rather than partially
janusgraph:
  image: *janusgraph
  imagePullSecrets:
    - name: "registry-secret-name"
  sidecars:
    - name: logstash
      image: *janusgraph_logstash
      imagePullPolicy: Always
      env:
        - name: PIPELINE_WORKERS
          value: "1"
        - name: PIPELINE_BATCH_SIZE
          value: "1"
        - name: LS_JAVA_OPTS
          value: "-Dnetworkaddress.cache.ttl=30 -Dnetworkaddress.cache.negative.ttl=10"
      livenessProbe:
        httpGet:
          path: /
          port: 9600
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      volumeMounts:
        - name: janusgraph-configs
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
        - name: empty-dir
          mountPath: /opt/bitnami/janusgraph/logs
          subPath: app-logs-dir

# Flat keys read directly off each building block's own root values (these
# umbrella-level templates were reading a hardcoded literal until now, see
# the anchors' comment above)
job_cleaner_kubectl_image: *job_cleaner_kubectl_image
job_wait_image: *job_wait_image
yugabyte_migration_image: *yugabyte_migration_image
opensearch_migration_image: *opensearch_migration_image

# envoy/opa/proxy_init are read inside the knowledgemw SUBCHART's own
# template, so .Values there resolves against edbb.knowledgemw.*, not
# edbb's own root — has to be nested here, unlike the three flat keys above
knowledgemw:
  image: *knowledge_mw
  imagePullSecrets:
    - name: "registry-secret-name"
  envoy_image: *envoy_image
  opa_image: *opa_image
  proxy_init_image: *proxy_init_image

# Flink images
global:
  # learnbb/knowledgebb/obsrvbb's templates/provision/kafka.yaml Job reads
  # global.kafka.image directly (a frozen snapshot of each bb's own local
  # kafka: anchor) instead of kafka.image above, so it never picked up the
  # override either
  kafka:
    image: *kafka

  knowledgeflink:
    registry: "ghcr.io"
    repository: "sunbird-knowlg/knowledge-platform-jobs"
    tag: "spark-v1.1.0_dec74d7"

  learnflink:
    registry: "ghcr.io/sunbird-lern"
    repository: "data-pipeline"
    tag: "spark-v1.1.0_f36189f"

  # ai-pipeline (PyFlink 1.20) jobs, deployed via the consolidated
  # `py-flink` chart's py_flink_jobs map (helmcharts/knowledgebb/charts/
  # py-flink) — each job entry there points at one of these anchors via
  # its own `globalImageKey`, since (unlike knowledgeflink/learnflink
  # above, which are one shared JVM image per building block selected via
  # --job-classname) each PyFlink job ships its own dedicated image. See
  # ai-pipeline/docker/Dockerfile.enrichment-router and
  # Dockerfile.caption-generator.
  #
  # Built and pushed by ai-pipeline's .github/workflows/build.yaml on tag
  # push — tag format is <git-tag>_<short-sha> (see knowlg-service.yml for
  # the same convention).
  enrichment_router:
    registry: "ghcr.io"
    repository: "sunbird-knowlg/ai-pipeline/enrichment-router"
    tag: "spark-v1.1.0_93887dd"

  caption_generator:
    registry: "ghcr.io"
    repository: "sunbird-knowlg/ai-pipeline/caption-generator"
    tag: "spark-v1.0.3-captions-beta46_64dd2a3"
