#monitoring
alloy:
 # Run the log collector on every node, including tainted database-only
 # nodes (dedicated=yb), which otherwise send no logs.
 controller:
    tolerations:
      - operator: Exists
 alloy:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

kube-prometheus-stack:
  alertmanager:
    alertmanagerSpec:
      resources:
        limits:
          cpu: "0.1"
          memory: 256Mi
        requests:
          cpu: "0.1"
          memory: 128Mi
  prometheusOperator:
    prometheusConfigReloader: 
      resources:
        requests:
          cpu: 200m
          memory: 50Mi
        limits:
          cpu: 200m
          memory: 50Mi
  prometheus:
    prometheusSpec:
      retention: "7d"
      # Benchmark tuning: 50Gi with a size cap (10Gi filled up and Prometheus
      # crash-looped), 8/16Gi memory, and the Go runtime kept under the limit.
      retentionSize: "45GB"
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      resources:
        requests:
          cpu: 1
          memory: 8Gi
        limits:
          cpu: 2
          memory: 16Gi
      containers:
        - name: prometheus
          env:
            - name: GOMEMLIMIT
              value: 12GiB
            - name: GOMAXPROCS
              value: "2"

