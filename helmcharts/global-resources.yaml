yugabyte:
  serviceEndpoints:
    - name: "yb-master-ui"
      app: "yb-master"
      loadBalancerIP: ""
      type: "ClusterIP"
      ports:
        http: 7000
    - name: "yb-tserver-service"
      app: "yb-tserver"
      loadBalancerIP: ""
      type: "ClusterIP"
      ports:
        tcp-yql-port: 9042
        tcp-yedis-port: 6379
        tcp-rpc-port: 9100
        http-ysql: 5433
    - name: "yugabyted-ui-service"
      app: "yb-tserver"
      loadBalancerIP: ""
      type: "ClusterIP"
      ports:
        http: 15433
  resource:
    master:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 4Gi
    # Benchmark tuning: 12 vCPU / 32Gi per tserver (one tserver per 16-vCPU
    # node). The chart derives --num_cpus and --memory_limit_hard_bytes from
    # these limits.
    tserver:
      requests:
        cpu: "12"
        memory: 32Gi
      limits:
        cpu: "12"
        memory: 32Gi
  storage:
    master:
      count: 2
      size: 10Gi
    tserver:
      count: 2
      size: 25Gi
