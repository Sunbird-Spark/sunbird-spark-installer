{{- if or .Values.serviceAccount.create .Values.global.cert_manager_ssl }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.global.cert_manager_ssl }}
---
# Scoped to exactly one read on one named Secret -- just enough for the
# wait-for-cert initContainer to poll whether cert-manager has finished
# issuing the certificate yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "common.names.fullname" . }}-wait-for-cert
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "common.names.fullname" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-wait-for-cert
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "common.names.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "common.names.fullname" . }}-wait-for-cert
  apiGroup: rbac.authorization.k8s.io
{{- end }}
