{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
{{- $currentScope := .}}
{{- range $path, $_ := .Files.Glob "configs/*" }}
  {{- $skip := eq $path "configs/env.yaml" }}
  {{- if and $.Values.global.cert_manager_ssl (or (eq $path "configs/tls.crt") (eq $path "configs/tls.key")) }}
    {{- /* cert-manager owns tls.crt/tls.key exclusively -- see cert-manager-issuer.yaml */}}
    {{- $skip = true }}
  {{- end }}
  {{- if not $skip }}
    {{ base $path | nindent 2 }}: |-
      {{- with $currentScope }}
      {{- $var := .Files.Get $path }}
      {{- include "common.tplvalues.render" (dict "value" $var "context" $) | nindent 6 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}