{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
{{- $currentScope := .}}
{{- range $path, $_ := .Files.Glob "configs/*" }}
  {{- $skip := eq $path "configs/env.yaml" }}
  {{- $rendered := "" }}
  {{- if not $skip }}
    {{- with $currentScope }}
    {{- $var := .Files.Get $path }}
    {{- $rendered = include "common.tplvalues.render" (dict "value" $var "context" $) }}
    {{- end }}
  {{- end }}
  {{- if and (or (eq $path "configs/tls.crt") (eq $path "configs/tls.key")) (or $.Values.global.cert_manager_ssl (eq (trim $rendered) "")) }}
    {{- /* cert-manager owns tls.crt/tls.key exclusively when enabled -- see
    cert-manager-issuer.yaml. And even on the static-cert path, never let a
    blank proxy_certificate/proxy_private_key (e.g. from flipping
    cert_manager_ssl back to false without filling these in, or merging an
    older values file) clobber whatever's already live in the Secret -- skip
    unless there's an actual non-empty value to write. */}}
    {{- $skip = true }}
  {{- end }}
  {{- if not $skip }}
    {{ base $path | nindent 2 }}: |-
      {{- $rendered | nindent 6 }}
  {{- end }}
{{- end }}
{{- end }}