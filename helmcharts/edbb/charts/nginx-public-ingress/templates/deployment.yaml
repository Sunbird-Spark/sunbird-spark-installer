apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}
      annotations:
        checksum/config: {{ .Files.Glob "configs/*" | toYaml | sha256sum }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.global.cert_manager_ssl }}
      serviceAccountName: {{ include "common.names.fullname" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.global.cert_manager_ssl .Values.initContainers }}
      initContainers:
      {{- if .Values.global.cert_manager_ssl }}
        # tls.crt/tls.key are subPath-mounted below, which requires both keys
        # to already exist in the Secret -- on a brand new domain, cert-manager
        # hasn't issued anything yet at first install, so this pod would
        # otherwise crash-loop before it can even serve the ACME challenge that
        # cert-manager needs routed through it. Block here until both keys show
        # up instead.
        - name: wait-for-cert
          image: bitnami/kubectl:1.31
          command: ["/bin/sh", "-c"]
          args:
            - |
              until kubectl get secret {{ include "common.names.fullname" . }} -n {{ .Release.Namespace }} -o jsonpath='{.data.tls\.crt}{.data.tls\.key}' | grep -q .; do
                echo "Waiting for cert-manager to issue the TLS certificate into the {{ include "common.names.fullname" . }} Secret..."
                sleep 5
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
          {{- if .Values.configmap.enabled }}
          - name: config
            mountPath: /etc/secrets/tls.key
            subPath: tls.key
          - name: config
            mountPath: /etc/secrets/tls.crt
            subPath: tls.crt
          - name: config
            mountPath: /etc/nginx/defaults.d/proxy-default.conf
            subPath: proxy-default.conf
          - name: config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: config
            mountPath: /etc/nginx/defaults.d/compression.conf
            subPath: compression.conf
          - name: config
            mountPath: /var/www/html/apple-app-site-association.json
            subPath: apple-app-site-association.json
          - name: addon-config
            mountPath: /etc/nginx/conf.d/addons
          {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      {{- if .Values.configmap.enabled }}
      - name: config
        secret:
          secretName: {{ include "common.names.fullname" . }}
      # addon-config: each installed addon drops a ConfigMap named <addon>-nginx-config
      # with a single key (e.g. nodebb.conf) containing nginx location blocks.
      # The volume is optional so the core chart works with no addons installed.
      - name: addon-config
        projected:
          sources:
          {{- range .Values.configmap.addon_config_configmaps }}
          - configMap:
              name: {{ . }}
              optional: true
          {{- end }}
      {{- end }}
