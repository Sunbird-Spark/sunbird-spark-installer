{{- if .Values.global.cert_manager_ssl }}
# Replaces the old certbot cronjob's manual DNS-01 bootstrap + patch-the-Secret
# renewal flow. cert-manager owns the {{ include "common.names.fullname" . }}
# Secret exclusively from here on -- the root Secret template skips
# tls.crt/tls.key entirely when this flag is set, so there's nothing left to
# fight over ownership of those two keys.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.global.cert_notifications.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: acme-http01-solver
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "common.names.fullname" . }}
  dnsNames:
    - {{ .Values.global.domain }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
{{- end }}
