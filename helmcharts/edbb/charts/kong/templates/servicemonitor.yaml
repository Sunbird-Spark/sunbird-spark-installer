---
{{- if .Values.serviceMonitor.enabled }}
{{- if and ( .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" ) ( .Values.serviceMonitor.enabled ) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}-recording.rule
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
spec:
  groups:
  - name: apimanager-recording.rules
    rules:
    # Metric names/labels below match Kong 3.9.1's bundled prometheus plugin
    # (kong_http_requests_total, kong_request_latency_ms,
    # kong_upstream_latency_ms, kong_bandwidth_bytes) -- the pre-1.0
    # kong_request_count/kong_request_status_count/kong_latency_time/
    # kong_*_size family these rules previously used doesn't exist in this
    # repo's Kong version and never matched anything.
    - expr: sum(rate(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_request_count:rate:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*",code=~"2..|3.."}[5m])) by (service, code) / ignoring(code) group_left sum(increase(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_request_success_percentage:increase:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_request_count:increase:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*",code!~"2..|3..|5.."}[5m])) by (service, code) / ignoring(code) group_left  sum(increase(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_request_4xx_percentage:increase:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*",code!~"2..|3..|4.."}[5m])) by (service, code) / ignoring(code) group_left  sum(increase(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_request_5xx_percentage:increase:sum:1m
    - expr: sum(rate(kong_request_latency_ms_sum{service=~".*"}[5m]) / rate(kong_request_latency_ms_count{service=~".*"}[5m])) by (service)
      record: job:kong_latency_time_sum:rate:sum:1m
    - expr: sum(rate(kong_upstream_latency_ms_sum{service=~".*"}[5m])) by (service)  / sum(rate(kong_upstream_latency_ms_count{service=~".*"}[5m])) by (service)
      record: job:kong_upstream_latency_time_sum:rate:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*",code=~"2..|3.."}[5m])) by (service, code)
      record: job:kong_request_success_count:increase:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*",code!~"2..|3..|5.."}[5m])) by (service, code)
      record: job:kong_request_4xx_count:increase:sum:1m
    - expr: sum(increase(kong_http_requests_total{service=~".*",code!~"2..|3..|4.."}[5m])) by (service, code)
      record: job:kong_request_5xx_count:increase:sum:1m
    - expr: histogram_quantile(0.99, sum(rate(kong_request_latency_ms_bucket{service=~".*"}[5m])) by (service,le))
      record: job:kong_latency_time_bucket99:rate:sum:1m
    - expr: histogram_quantile(0.99, sum(rate(kong_upstream_latency_ms_bucket{service=~".*"}[5m])) by (service,le))
      record: job:kong_upstream_latency_time_bucket99:rate:sum:1m
    - expr: histogram_quantile(0.95, sum(rate(kong_request_latency_ms_bucket{service=~".*"}[5m])) by (service,le))
      record: job:kong_latency_time_bucket95:rate:sum:1m
    - expr: histogram_quantile(0.95, sum(rate(kong_upstream_latency_ms_bucket{service=~".*"}[5m])) by (service,le))
      record: job:kong_upstream_latency_time_bucket95:rate:sum:1m
    - expr: histogram_quantile(0.50, sum(rate(kong_request_latency_ms_bucket{service=~".*"}[5m])) by (service,le))
      record: job:kong_latency_time_bucket50:rate:sum:1m
    - expr: histogram_quantile(0.50, sum(rate(kong_upstream_latency_ms_bucket{service=~".*"}[5m])) by (service,le))
      record: job:kong_upstream_latency_time_bucket50:rate:sum:1m
    # kong_request_size/kong_response_size (separate histograms) don't exist
    # anymore -- Kong now reports a single kong_bandwidth_bytes counter split
    # by direction (ingress=request, egress=response), with no companion
    # count series of its own. Average bytes-per-request is reconstructed by
    # dividing by the request count over the same window instead.
    - expr: sum(rate(kong_bandwidth_bytes{service=~".*",direction="ingress"}[5m])) by (service) / sum(rate(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_average_request_size_sum:rate:sum:1m
    - expr: sum(rate(kong_bandwidth_bytes{service=~".*",direction="egress"}[5m])) by (service) / sum(rate(kong_http_requests_total{service=~".*"}[5m])) by (service)
      record: job:kong_average_response_size_sum:rate:sum:1m
    - expr: sum(rate(kong_bandwidth_bytes{service=~".*",direction="ingress"}[5m])) by (service)
      record: job:kong_total_request_size_sum:rate:sum:1m
    - expr: sum(rate(kong_bandwidth_bytes{service=~".*",direction="egress"}[5m])) by (service)
      record: job:kong_total_response_size_sum:rate:sum:1m
    - expr: sum(rate(kong_request_latency_ms_bucket{service=~".*", le="50"}[5m])) by (service) / sum(rate(kong_request_latency_ms_count{service=~".*"}[5m])) by (service)
      record: job:kong_latency_time_bucket:rate:sum:1m
{{- end }}
{{- end }}
