apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}
      annotations:
        checksum/config: {{ .Files.Glob "files/*" | toYaml | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "common.names.fullname" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          envFrom:
          - configMapRef:
              name: {{ include "common.names.fullname" . }}-env
          - secretRef:
              name: {{ include "common.names.fullname" . }}-secrets
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: sunbird_sso_publickey
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.global.keycloak_kid_keys_configmap }}
                key: KEYCLOAK_PUBLIC_KEY
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
          {{- if .Values.configmap.enabled }}
          - name: config
            mountPath: {{ .Values.configmap.mountPath }}
          {{- end }}
          - name: keys
            mountPath: /home/sunbird/mw/content/keys/
          {{- include "sunbird.yugabyteCAVolumeMount" . | nindent 10 }}
{{- if .Values.opa_enabled }}
        - args:
          - envoy
          - --config-path
          - /config/config.yaml
          {{- with .Values.envoy_concurrency }}
          - --concurrency
          - {{ . | quote }}
          {{- end }}
          env:
          - name: ENVOY_UID
            value: "1111"
          image: "{{ .Values.envoy_image.registry }}/{{ .Values.envoy_image.repository }}:{{ .Values.envoy_image.tag }}"
          imagePullPolicy: IfNotPresent
          name: envoy
          livenessProbe:
            {{ toYaml .Values.envoy_probes | nindent 12 }}
          readinessProbe:
            {{ toYaml .Values.envoy_probes | nindent 12 }}
          resources:
            {{ toYaml .Values.envoy_resources | nindent 12 }}
          volumeMounts:
            - mountPath: /config
              name: envoy-config
              readOnly: true
        - name: opa
          image: "{{ .Values.opa_image.registry }}/{{ .Values.opa_image.repository }}:{{ .Values.opa_image.tag }}"
          imagePullPolicy: IfNotPresent
          # Policies and the Keycloak key are rendered once by the opa-render
          # init container, so OPA starts directly. Decision logging
          # (print_decision_logs_on_failure) is off: it cost CPU on every
          # denied request under load.
          command: ["/opa"]
          args:
          - run
          - --server
          - /policies
          - --v0-compatible
          - --addr=localhost:8181
          - --diagnostic-addr=0.0.0.0:8282
          - --set=plugins.envoy_ext_authz_grpc.addr=:9191
          - --set=plugins.envoy_ext_authz_grpc.path=main/allow
          - --log-level=error
          - --ignore=.*
          {{- with .Values.opa_env }}
          env:
          {{- range $name, $value := . }}
          - name: {{ $name }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.opa_probes | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.opa_probes | nindent 12 }}
          resources:
            {{- toYaml .Values.opa_resources | nindent 12 }}
          volumeMounts:
            - mountPath: /opa-policies
              name: opa-policy
              readOnly: true
            - name: keycloak-key
              mountPath: /keys/
            - mountPath: /policies
              name: opa-rendered
              readOnly: true
      initContainers:
        - args:
          - -p
          - "9999"
          - -u
          - "1111"
          - -w
          - "8282,10000"
          image: "{{ .Values.proxy_init_image.registry }}/{{ .Values.proxy_init_image.repository }}:{{ .Values.proxy_init_image.tag }}"
          imagePullPolicy: IfNotPresent
          name: proxy-init
          resources:
            {{ toYaml .Values.init_container_resources | nindent 12 }}
          securityContext:
            capabilities:
              add:
              - NET_ADMIN
            runAsNonRoot: false
            runAsUser: 0
        - name: opa-render
          image: "{{ .Values.opa_render_image.registry }}/{{ .Values.opa_render_image.repository }}:{{ .Values.opa_render_image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
          - |
            KID=$(cat /keys/KEYCLOAK_PUBLIC_KEY_KID) && PUBLIC_KEY=$(cat /keys/KEYCLOAK_PUBLIC_KEY) && \
            PUBLIC_KEY_PEM=$(echo "$PUBLIC_KEY" | sed -e 's/.\{64\}/&\\\\n/g' -e '1s/^/-----BEGIN PUBLIC KEY-----\\\\n/' -e '$s/$/\\\\n-----END PUBLIC KEY-----/') && \
            cp -Lr /opa-policies/*.rego /policies && \
            sed -i "s|KEYCLOAK_KID|$KID|g" /policies/common.rego && \
            sed -i "s|KEYCLOAK_PUBLIC_KEY|$PUBLIC_KEY_PEM|g" /policies/common.rego
          resources:
            {{- toYaml .Values.opa_render_resources | nindent 12 }}
          volumeMounts:
            - mountPath: /opa-policies
              name: opa-policy
              readOnly: true
            - name: keycloak-key
              mountPath: /keys/
              readOnly: true
            - mountPath: /policies
              name: opa-rendered
{{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: env
        configMap:
          name: {{ include "common.names.fullname" . }}-env
      {{- if .Values.configmap.enabled }}
      - name: config
        configMap:
          name: {{ include "common.names.fullname" . }}
      {{- end }}
      {{- include "sunbird.yugabyteCAVolume" . | nindent 6 }}
{{- if .Values.opa_enabled }}
      - name: envoy-config
        configMap:
          name: {{ include "common.names.fullname" . }}-envoy
      - name: opa-policy
        configMap:
          name: {{ include "common.names.fullname" . }}-opa
      - name: keycloak-key
        configMap:
          name: {{ .Values.global.keycloak_kid_keys_configmap }}
      - name: opa-rendered
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
{{- end }}
      - name: keys
        projected:
          sources:
          - configMap:
              name: {{ include "common.names.fullname" . }}-access-keys
          - configMap:
              name: {{ .Values.global.keycloak_key_configmap }}
