nameOverride: "knowledge-mw"
fullnameOverride: "knowledge-mw"

replicaCount: 1

image:
  repository: ghcr.io/sunbird-knowlg/knowledge-mw-service
  tag: "release-8.0.0_rc4_69b20a6_4"
  pullPolicy: IfNotPresent
  pullSecrets: []

podAnnotations: {}

podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1001
  # fsGroup: 1001

securityContext: {}
  # readOnlyRootFilesystem: false
  # capabilities:
  #   drop:
  #   - ALL

service:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: 5000

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
      - /

resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    cpu: 1
    memory: 1G

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

livenessProbe:
  failureThreshold: 10
  httpGet:
      path: /service/health
      port: 5000
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 10

readinessProbe:
  failureThreshold: 10
  httpGet:
      path: /service/health
      port: 5000
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 10

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge-mw

configmap:
  enabled: true
  mountPath: /config

serviceAccount:
  create: false
  name: ""

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: monitoring
  honorLabels: true
  jobLabel: "app.kubernetes.io/name"

# Example values.yaml structure
initContainers: {}
  # - name: init-myservice
  #   image: busybox:1.28
  #   command: ['sh', '-c', "until nslookup kubernetes.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]

sidecars: {}
  # - name: log-reader # Sidecar container
  #   image: busybox # Use another busybox image
  #   command: ["/bin/sh"] # Override the default command
  #   args: ["-c", "tail -f /var/log/app.log"] # Run a shell script that tails the log file

envoy_probes:
  failureThreshold: 2
  httpGet:
    path: /ready
    port: 10000
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5

opa_probes:
  failureThreshold: 3
  httpGet:
    path: /health?plugins
    port: 8282
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5

envoy_resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

opa_resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

init_container_resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "1"
    memory: "1024Mi"

opa_enabled: false

envoy_image:
  registry: "docker.io"
  repository: "envoyproxy/envoy"
  tag: "v1.20.0"

opa_image:
  registry: "docker.io"
  repository: "openpolicyagent/opa"
  tag: "1.22.3-envoy@sha256:6ce6563695665a4c06338832e0a532c4dbf16f7beea05386ad0a6eb91d9e8593"

proxy_init_image:
  registry: "docker.io"
  repository: "openpolicyagent/proxy_init"
  tag: "v5"

commonAnnotations:
  reloader.stakater.com/auto: "true"

# Envoy worker threads; match the envoy CPU limit
envoy_concurrency: 2

# Go runtime for OPA: GOMAXPROCS = OPA CPU limit, GOGC=200 trades memory for less GC CPU
opa_env:
  GOMAXPROCS: "2"
  GOGC: "200"

opa_render_resources:
  requests:
    cpu: "10m"
    memory: "16Mi"
  limits:
    cpu: "200m"
    memory: "64Mi"

# Renders the OPA policies + Keycloak key before OPA starts (see deployment.yaml)
opa_render_image:
  registry: "docker.io"
  repository: "library/busybox"
  tag: "1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
# Benchmark tuning: spread replicas across nodes (hostname only, no node labels)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: knowledge-mw
