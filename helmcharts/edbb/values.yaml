# Default values for obsrvbb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
fullname: edbb
replicaCount: 1
devops_release_branch: release-7.0.0

provisioningAnnotations: &provisioningAnnotations
  "helm.sh/hook-weight": "-4"
    # "helm.sh/hook": post-install,post-upgrade

kafka: &kafka
  enabled: true
  nameOverride: kafka
  fullnameOverride: kafka
  clientProtocol: PLAINTEXT
  host: kafka
  port: 9092
  image:
    registry: sunbirded.azurecr.io
    repository: kafka
    tag: 3.3.1-debian-11-r25
  persistence:
    size: 25Gi
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 10
    periodSeconds: 30
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    failureThreshold: 5
    timeoutSeconds: 10
    periodSeconds: 30
    successThreshold: 1
  commonAnnotations:
    "helm.sh/hook-weight": "-5"
  provisioning:
    annotations: *provisioningAnnotations
    replicationFactor: 1
    numPartitions: 1
  resources:
    limits:
      cpu: 1
      memory: 2048Mi
    requests:
      cpu: 750m
      memory: 1024Mi
  listeners:
    client:
      protocol: PLAINTEXT
  controller:
      protocol: PLAINTEXT
      # Benchmark tuning: one broker per node (required) and tolerate the
      # dedicated=yb taint of database-only node pools (no-op elsewhere).
      podAntiAffinityPreset: hard
      tolerations:
        - {key: dedicated, operator: Equal, value: yb, effect: NoSchedule}
  interbroker:
      protocol: PLAINTEXT
  external:
      protocol: PLAINTEXT
  sasl:
    enabledMechanisms: "PLAIN"
    interBrokerMechanism: "PLAIN"
    controllerMechanism: "PLAIN"
  tls:
    autoGenerated:
      enabled: false
    existingSecret: ""

knowledgemw:
  opa_enabled: true

migration:
  yugabyte:
    waitTime: 120

job_cleaner_kubectl_image:
  registry: "sunbirded.azurecr.io"
  repository: "kubectl"
  tag: "1.28.4"

job_wait_image:
  registry: "docker.io"
  repository: "busybox"
  tag: "latest"

yugabyte_migration_image:
  registry: "docker.io"
  repository: "yugabytedb/yugabyte"
  tag: "latest"

nginx-private-ingress:
  enabled: false

redis: &redis
  enabled: false
  registry: "sunbirded.azurecr.io"
  repository: "redis"
  replica:
    replicaCount: 0
  nameOverride: "redis"
  fullnameOverride: "redis"
  auth:
    enabled: false
  host: "redis-master"
  port: 6379
  commonAnnotations:
    "helm.sh/hook-weight": "-5"
  master:
    persistence:
      size: 25Gi
    primary:
    resources:
      limits:
        cpu: 0.5
        memory: 2Gi
      requests:
        cpu: 0.5
        memory: 1Gi 

router:
  enabled: false

secor:
  enabled: true
  serviceAccount:
    create: false

yugabyte: &yugabyte
  enabled: true
  serviceMonitor:
    enabled: true
    extraLabels:
      release: monitoring
    # Benchmark tuning: drop per-tablet series (metric_type="tablet"); they
    # multiply with tablet count and overloaded Prometheus. The rest of this
    # list is the chart's default commonMetricRelabelings, repeated because
    # Helm replaces lists instead of merging them.
    commonMetricRelabelings:
    - sourceLabels:
      - metric_type
      regex: tablet
      action: drop
    - sourceLabels:
      - __name__
      regex: (.*)
      targetLabel: saved_name
      replacement: $1
    - sourceLabels:
      - __name__
      regex: handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(.*)
      targetLabel: server_type
      replacement: $1
    - sourceLabels:
      - __name__
      regex: handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(.*)
      targetLabel: service_type
      replacement: $2
    - sourceLabels:
      - __name__
      regex: handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(_sum|_count)?
      targetLabel: service_method
      replacement: $3
    - sourceLabels:
      - __name__
      regex: handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(_sum|_count)?
      targetLabel: __name__
      replacement: rpc_latency$4
  nameOverride: "yugabyte"
  fullnameOverride: "yugabyte"
  host: "yb-tserver-service" 
  port: 9042
  postgresql_port: 5433
  databases:
      - name: "kong"
      - name: "superset"
      - name: "registry"
      - name: "portal"
      - name: "sunbird"
  gflags:
    tserver: 
      cdc_enable_replicate_intents: "true"
      ysql_enable_read_committed_isolation: "true"
  image:
    registry: yugabytedb
    repository: yugabyte
    tag: 2025.2.0.0-b131 
  commonAnnotations:
    "helm.sh/hook-weight": "-5"
  provisioning:
    annotations: *provisioningAnnotations
  # Force single replica for Yugabyte masters and tservers (override subchart defaults)
  replicas:
    master: 3
    tserver: 3
  # Benchmark tuning: one master and one tserver per node (required), and
  # tolerate the dedicated=yb taint used for database-only node pools
  # (a no-op where no node carries that taint).
  master:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: yb-master
    tolerations:
      - {key: dedicated, operator: Equal, value: yb, effect: NoSchedule}
  tserver:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: yb-tserver
    tolerations:
      - {key: dedicated, operator: Equal, value: yb, effect: NoSchedule}
  username: "yugabyte"
  password: "yugabyte"  

nginx-public-ingress:
  enabled: true

# cert-manager and ingress-nginx are only needed when
# global.cert_manager_ssl is true (see nginx-public-ingress's
# cert-manager-issuer.yaml). ingress-nginx here is *not* the platform's
# public entrypoint -- nginx-public-ingress stays that -- it exists solely
# so cert-manager's HTTP-01 solver has a real controller to reconcile its
# per-challenge Ingress objects against. Kept ClusterIP-only, never
# internet-facing on its own.
cert-manager:
  enabled: false
  fullnameOverride: cert-manager
  crds:
    enabled: true
    # Explicit even though it's the chart default: without this, `helm
    # uninstall edbb` would delete the CRDs (they render as ordinary release
    # templates here, not a separate crds/ hook directory) and cascade-delete
    # every Certificate/Issuer/Order/Challenge across the whole cluster, not
    # just this release's.
    keep: true

ingress-nginx:
  enabled: false
  fullnameOverride: ingress-nginx
  controller:
    ingressClassResource:
      name: acme-http01-solver
      enabled: true
      default: false
    ingressClass: acme-http01-solver
    watchIngressWithoutClass: false
    service:
      type: ClusterIP
    admissionWebhooks:
      enabled: false
    metrics:
      enabled: false
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 90Mi
      limits:
        cpu: 200m
        memory: 200Mi
  defaultBackend:
    enabled: false

echo:
  enabled: true

player:
  enabled: true

kong:
  enabled: true

kong-apis:
  enabled: true

kong-consumers:
  enabled: true

global:
  kafka: *kafka
  keycloak_key_configmap: keycloak-key
  keycloak_kid_keys_configmap: keycloak-kids-keys
  kong_desktop_device_consumer_names_for_opa: '["portal", "desktop"]'
  redis: *redis
  yugabyte: *yugabyte