{{- if .Values.secretEnv.create -}}
{{/*
  SUPERSET_SECRET_KEY must be stable across upgrades (it signs Flask sessions/CSRF
  tokens and Superset's permalink/cache hashes) -- re-rendering a fresh random value on
  every `helm upgrade` would invalidate every active session on every routine redeploy.
  Preserve whatever's already in the live Secret; only generate a new one if this is a
  genuinely fresh install with no override and no existing Secret to read from.
*/}}
{{- $secretName := printf "%s-env" (include "superset.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $supersetSecretKey := "" }}
{{- if (and .Values.extraSecretEnv .Values.extraSecretEnv.SUPERSET_SECRET_KEY) }}
{{- $supersetSecretKey = .Values.extraSecretEnv.SUPERSET_SECRET_KEY }}
{{- else if (and $existingSecret $existingSecret.data (index $existingSecret.data "SUPERSET_SECRET_KEY")) }}
{{- $supersetSecretKey = index $existingSecret.data "SUPERSET_SECRET_KEY" | b64dec }}
{{- else }}
{{- $supersetSecretKey = randAlphaNum 42 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "superset.fullname" . }}
    chart: {{ template "superset.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    {{- if .Values.extraLabels }}
      {{- toYaml .Values.extraLabels | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
    DB_HOST: {{ .Values.global.yugabyte.host | quote }}
    DB_PORT: {{ .Values.global.yugabyte.postgresql_port | quote }}
    DB_USER: {{ .Values.global.yugabyte.ysql.user | quote }}
    DB_PASS: {{ .Values.global.yugabyte.ysql.password | quote }}
    DB_NAME: {{ (index .Values.global.yugabyte.databases 0).name | quote }}
    SUPERSET_SECRET_KEY: {{ $supersetSecretKey | quote }}
    {{- if .Values.extraSecretEnv }}
    {{- range $key, $value := .Values.extraSecretEnv }}
    {{- if ne $key "SUPERSET_SECRET_KEY" }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
