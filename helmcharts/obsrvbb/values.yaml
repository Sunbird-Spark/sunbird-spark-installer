replicaCount: 1
fullname: obsrvbb
env: &env
default: "dev"

provisioningAnnotations: &provisioningAnnotations
  "helm.sh/hook-weight": "-4"

kafka: &kafka
  enabled: true
  nameOverride: "kafka"
  fullnameOverride: "kafka"
  clientProtocol: PLAINTEXT
  host: "kafka"
  port: 9092
  image:
    registry: sunbirded.azurecr.io
    repository: kafka
    tag: 3.3.1-debian-11-r25
  commonAnnotations:
    "helm.sh/hook-weight": "-5"
  persistence:
    size: 25Gi
  provisioning:
    nameOverride: "provisioning"
    fullnameOverride: "provisioning"
    annotations: *provisioningAnnotations
    replicationFactor: 1
    numPartitions: 1
    topics:
    - name: "{{ .Values.global.env }}.nlweb.ingest"
    - name: "{{ .Values.global.env }}.telemetry.ingest"
    parallel: 1
  listeners:
    client:
      protocol: PLAINTEXT
  controller:
      protocol: PLAINTEXT
  interbroker:
      protocol: PLAINTEXT
  external:
      protocol: PLAINTEXT
  sasl:
    enabledMechanisms: ""
    interBrokerMechanism: ""
    controllerMechanism: ""
  tls:
    autoGenerated:
      enabled: false
    existingSecret: ""

superset:
  enabled: true

yugabyte: &yugabyte
  enabled: true
  nameOverride: "yugabyte"
  fullnameOverride: "yugabyte"
  host: "yb-tserver-service" 
  port: 9042
  postgresql_port: 5433
  databases:
    - name: "superset"
  image:
    registry: yugabytedb
    repository: yugabyte
    tag: 2025.2.0.0-b131 
  commonAnnotations:
    "helm.sh/hook-weight": "-5"
  provisioning:
    annotations: *provisioningAnnotations  
  # Force single replica for Yugabyte masters and tservers (override subchart defaults)
  replicas:
    master: 3
    tserver: 3
  username: yugabyte
  password: yugabyte

# Which database backend is actually in use -- see edbb/values.yaml for the
# full explanation. The real cassandra/postgresql instance lives in edbb
# (mirrors how yugabyte's own StatefulSets live there today); this bundle
# declares the same two subcharts too (so it could be deployed standalone),
# but leaves them disabled since edbb already provides the shared instance.
use_cassandra_postgres: &use_cassandra_postgres true

cassandra: &cassandra
  enabled: false
  nameOverride: "cassandra"
  fullnameOverride: "cassandra"
  host: "cassandra"
  port: 9042
  image:
    registry: docker.io
    repository: cassandra
    tag: 5.0.9-bookworm
  persistence:
    size: 25Gi
  extraEnvVars:
    - name: CASSANDRA_AUTHENTICATOR
      value: AllowAllAuthenticator
    - name: CASSANDRA_AUTHORIZER
      value: AllowAllAuthorizer
  commonAnnotations:
    "helm.sh/hook-weight": "-5"

postgresql: &postgresql
  enabled: false
  fullnameOverride: "postgresql"
  host: "postgresql"
  port: 5432
  postgresqlUsername: postgres
  postgresqlPassword: postgres
  image:
    registry: docker.io
    repository: postgres
    tag: 18.6-bookworm
  persistence:
    size: 25Gi
  databases:
    - name: "superset"

global:
  kafka: *kafka
  yugabyte: *yugabyte
  cassandra: *cassandra
  postgresql: *postgresql
  use_cassandra_postgres: *use_cassandra_postgres
