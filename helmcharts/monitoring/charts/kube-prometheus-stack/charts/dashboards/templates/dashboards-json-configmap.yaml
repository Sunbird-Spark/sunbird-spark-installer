{{- if .Values.dashboards }}
{{ $files := .Files }}
{{- range $provider, $dashboards := .Values.dashboards }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "dashboards.fullname" $ }}-dashboards-{{ $provider }}
  labels:
    app: {{ template "dashboards.name" $ }}
    chart: {{ template "dashboards.chart" $ }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    dashboard-provider: {{ $provider }}
    grafana_dashboard: "1"
{{- if $dashboards }}
data:
{{- $dashboardFound := false }}
{{- range $key, $value := $dashboards }}
{{- if (or (hasKey $value "json") (hasKey $value "file")) }}
{{- $dashboardFound = true }}
{{ print $key | indent 2 }}.json:
{{- if hasKey $value "json" }}
    |-
{{ $value.json | indent 6 }}
{{- end }}
{{- if hasKey $value "file" }}
{{- $raw := $files.Get $value.file }}
{{- if eq $value.file "dashboards/secor-consumarlag-kafka.json" }}
{{- /* This dashboard's $env template var is a hardcoded "dev" constant used to
   prefix-match kafka topic names (topic=~"$env.*"), but every environment
   (test, sandbox, uat, stage, ...) names its topics after itself -- so this
   only ever worked by coincidence on "dev". Swap in the real per-environment
   name here (same one every other bundle already uses) instead of hardcoding
   another single environment. Scoped to just this file and plain string
   substitution (not tpl) since this JSON also uses Grafana's own {{topic}}/
   {{partition}} legend-format syntax, which tpl would wrongly try to
   evaluate as Go template expressions. */ -}}
{{- $env := $.Values.global.environment }}
{{- $raw = $raw | replace "\"text\": \"dev\",\n          \"value\": \"dev\"" (printf "\"text\": \"%s\",\n          \"value\": \"%s\"" $env $env) }}
{{- $raw = $raw | replace "\"text\": \"dev\",\n            \"value\": \"dev\"" (printf "\"text\": \"%s\",\n            \"value\": \"%s\"" $env $env) }}
{{- $raw = $raw | replace "\"query\": \"dev\"," (printf "\"query\": \"%s\"," $env) }}
{{- end }}
{{ toYaml $raw | indent 4}}
{{- end }}
{{- end }}
{{- end }}
{{- if not $dashboardFound }}
  {}
{{- end }}
{{- end }}
---
{{- end }}

{{- end }}
