enabled: true

image:
  repository: "ghcr.io/sunbird-spark/yugabyte-backup"
  tag: "1.0.0"
  pullPolicy: Always   # tag is mutable (e.g. 1.0.0), not a per-commit sha — always pull the latest push
  imagePullSecrets: "registry-secret-name"

schedule: "30 11 * * 5"    # weekly, Friday 5:00 PM IST
restartPolicy: OnFailure
retryLimit: 3

yugabyte:
  host: "yb-tserver-service"
  ysqlPort: "5433"
  ycqlPort: "9042"
  user: "yugabyte"
  password: "yugabyte"

# Space-separated list of YSQL databases to back up
ysqlDatabases: "keycloak registry quartz enc-keys kong portal superset sunbird"

# Comma-separated YCQL keyspaces. Empty = auto-discover all non-system keyspaces
# (covers all ~15 in-scope keyspaces, including janusgraph, with no list to maintain)
ycqlKeyspaces: ""

# days to keep backup files in cloud storage; 56 = ~8 weekly backups.
# Final retention count is still TBD — see plan's Open Items.
retentionDays: "56"
ttlSecondsAfterFinished: 86400   # seconds to keep completed Job pods (24h)

serviceAccount:
  create: false
  name: ""   # empty = use global.workload_identity_service_account_name (workload identity SA in sunbird namespace)

podAnnotations:
  azure.workload.identity/use: "true"
