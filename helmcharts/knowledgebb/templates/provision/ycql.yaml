apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-yugabytecql-migration-job
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-yugabytecql-migration
    scope: provisioning
  annotations:
    {{.Values.global.yugabyte.provisioning.annotations | toYaml }}
spec:
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-yugabytecql-migration
    spec:
      restartPolicy: Never
      # No kubectl/K8s-API calls in this job -- YCQL migration only.
      automountServiceAccountToken: false
      volumes:
      - name: shared-volume
        emptyDir: {}
      initContainers:
      - name: wait-for-yugabyte
        image: busybox
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        command: ["/bin/sh", "-c"]
        args:
        - "timeout {{ .Values.migration.yugabyte.waitTime }} sh -c 'until nc -z {{ include "sunbird.cassandraHost" $ }} {{ include "sunbird.cassandraPort" $ }}; do echo waiting for cassandra; sleep 10; done'"
        volumeMounts:
        - name: shared-volume
          mountPath: /opt/shared-volume
      {{- if .Values.global.use_cassandra_postgres }}
      - name: prepare-cassandra-migrations
        image: {{ .Values.yugabytecql.image.repository }}:{{ .Values.yugabytecql.image.tag }}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
            ephemeral-storage: 512Mi
        command: ['bash', '-c']
        args:
        - |
          set -ex
          cp -r /opt/migrations/sunbird-yugabyte-migrations /opt/shared-volume/
          {{- include "sunbird.cassandraCompatSed" . | nindent 10 }} /opt/shared-volume/sunbird-yugabyte-migrations/*/*.cql
        volumeMounts:
        - name: shared-volume
          mountPath: /opt/shared-volume
      {{- end }}
      containers:
      - name: migration
        {{- if .Values.global.use_cassandra_postgres }}
        image: "{{ .Values.global.cassandra.image.registry }}/{{ .Values.global.cassandra.image.repository }}:{{ .Values.global.cassandra.image.tag }}"
        {{- else }}
        image: {{ .Values.yugabytecql.image.repository }}:{{ .Values.yugabytecql.image.tag }}
        {{- end }}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
            ephemeral-storage: 512Mi
        command: ['bash', '-c']
        args:
        - |
          set -ex
          export ENV={{ .Values.global.env | default "dev" }}
          export YCQLSH_HOST={{ include "sunbird.cassandraHost" $ }}
          export YCQLSH_PORT={{ include "sunbird.cassandraPort" $ }}
          export YCQLSH_USERNAME="${YCQLSH_USERNAME:-yugabyte}"
          export YCQLSH_PASSWORD="${YCQLSH_PASSWORD:-yugabyte}"
          {{- if .Values.global.use_cassandra_postgres }}
          MIGRATIONS_DIR=/opt/shared-volume/sunbird-yugabyte-migrations
          {{- include "sunbird.ycqlshShim" . | nindent 10 }}
          {{- else }}
          MIGRATIONS_DIR=/opt/migrations/sunbird-yugabyte-migrations
          {{- end }}

          # run migrations for knowledgebb
          cd $MIGRATIONS_DIR/sunbird-knowlg
          chmod +x execute_migrations.sh || true
          ./execute_migrations.sh $ENV
          # run migrations for inquirybb
          cd $MIGRATIONS_DIR/sunbird-inquiry
          chmod +x execute_migrations.sh || true
          set +e
          ./execute_migrations.sh $ENV
          MIGRATION_EXIT=$?
          set -e
          # Print log file to stdout so errors are visible in kubectl logs
          LOG_FILE=$(ls -t $MIGRATIONS_DIR/sunbird-knowlg/migration_*.log 2>/dev/null | head -1)
          if [ -n "$LOG_FILE" ]; then
            echo "======== MIGRATION LOG ========"
            cat "$LOG_FILE"
            echo "==============================="
          fi
          exit $MIGRATION_EXIT
        volumeMounts:
        - name: shared-volume
          mountPath: /opt/shared-volume
  backoffLimit: 30