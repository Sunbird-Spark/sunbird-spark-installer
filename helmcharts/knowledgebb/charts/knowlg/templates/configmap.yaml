{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
{{- $currentScope := .}}
{{- range $path, $_ := .Files.Glob "configs/*" }} # Take only root level files (configs/*) for configmaps
  {{- if ne $path "configs/env.yaml" }} # Skip env.yaml as configmap, as it's env file
    {{ base $path | nindent 2 }}: |-
      {{- with $currentScope }}
      {{- $var := .Files.Get $path }}
      {{- include "common.tplvalues.render" (dict "value" $var "context" $) | nindent 6 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{- $var := .Files.Get "configs/env.yaml" }}
  {{- include "common.tplvalues.render" (dict "value" $var "context" $) | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Named to match the ${?ENV_VAR} substitution keys read directly by
  # Typesafe Config in configs/application.conf -- unlike the plain env.yaml/
  # ConfigMap split used elsewhere in this repo, knowlg reads a compiled
  # application.conf file, not process env vars by key name, so the Secret
  # has to supply the exact env var names the HOCON substitution expects.
  CLOUD_STORAGE_SECRET: "{{ .Values.global.cloud_storage_secret_key }}"
  YOUTUBE_APIKEY: "{{ .Values.global.youtube_apikey }}"

{{- if .Values.opa.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-opa
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
{{- $currentScope := .}}
{{- range $path, $_ := .Files.Glob "configs/opa/**" }}
  {{ base $path | nindent 2 }}: |-
  {{- with $currentScope }}
  {{- $var := .Files.Get $path }}
  {{- include "common.tplvalues.render" (dict "value" $var "context" $) | nindent 6 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-envoy
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
{{ include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
{{- $currentScope := .}}
{{- range $path, $_ := .Files.Glob "configs/envoy/**" }}
  {{ base $path | nindent 2 }}: |-
  {{- with $currentScope }}
  {{- $var := .Files.Get $path }}
  {{- include "common.tplvalues.render" (dict "value" $var "context" $) | nindent 6 }}
  {{- end }}
{{- end }}
{{- end }}
