apiVersion: v2
name: py-flink
description: >-
  Helm chart for PyFlink 1.20 streaming jobs. Generates a dedicated
  JobManager and TaskManager deployment (Application Mode) and ConfigMap
  for each enabled job. Supports per-job Docker images and YAML configuration
  with environment variable overrides.
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: common
    repository: https://nimbushubin.github.io/helmcharts
    version: 0.1.0
