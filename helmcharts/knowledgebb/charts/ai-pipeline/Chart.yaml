apiVersion: v2
name: ai-pipeline
description: >-
  Restate-based AI enrichment pipeline (transcript generation + translation, and future
  workflows), replacing the retired py-flink enrichment-router/caption-generator jobs.
  Deploys core-api (the workflow registry/control-plane), a RestateCluster (via the
  restate-operator, installed separately, cluster-wide — see README.md), and one
  RestateDeployment per workflow/service unit.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: common
    repository: https://nimbushubin.github.io/helmcharts
    version: 0.1.0
