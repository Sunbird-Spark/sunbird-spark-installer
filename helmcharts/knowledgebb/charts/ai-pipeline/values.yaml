# ai-pipeline: Restate-based AI enrichment pipeline. Replaces py-flink's enrichment-router and
# caption-generator jobs. See README.md for the restate-operator prerequisite and open items.

nameOverride: ""
fullnameOverride: ""

# Must equal the restate-operator's CLUSTER_DNS (its default is cluster.local): each unit advertises
# the URL the operator registers for it, and Restate resolves the names core-api hands it from its
# own namespace.
clusterDomain: cluster.local

image:
  pullPolicy: IfNotPresent
  # Not global-values-driven anywhere in this repo (confirmed against every sibling chart) —
  # each chart carries its own, same as py-flink/flink/knowlg/search/sync-tool/janusgraph do.
  pullSecrets: []

commonLabels: {}
commonAnnotations: {}

# The RestateCluster this chart creates. Single-node deliberately, for now (see design doc §5) —
# scaling to a real multi-node cluster later is a `replicas`/`config` addition here, not a rewrite.
restate:
  clusterName: ai-pipeline-restate
  # References global.restate_server in helmcharts/images.yaml, matching every other chart's
  # globalImageKey convention (see py-flink's own `globalImageKey` usage).
  globalImageKey: restate_server
  storageRequestBytes: 2147483648 # 2 GiB to start
  # Labels of the Kafka broker pods in this release's namespace, which Restate's egress policy must
  # reach to consume trigger topics (see templates/restate/restatecluster.yaml).
  kafkaPodLabels:
    app.kubernetes.io/name: kafka

coreApi:
  replicaCount: 1
  globalImageKey: core_api
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # DATABASE_URL points at the shared YugabyteDB YSQL port (global.yugabyte.host/postgresql_port),
  # never a dedicated Postgres — see design doc §2. Database/user/password are chart-local so this
  # doesn't collide with any other YSQL consumer sharing the same YugabyteDB instance.
  database:
    name: ai_pipeline_catalogue
    user: ai_pipeline
    # Real value supplied via opentofu/<provider>/<env>/global-values.yaml, same convention as
    # global.openai_api_key — never committed here.
    passwordValue: ""
  env:
    litellmUrl: "http://litellm:4000"
    # Real value supplied the same way as global.openai_api_key — a hosted provider key in
    # production, replacing the local-testing Ollama model.
    litellmApiKeyValue: ""
  kafka:
    # A name inside Restate, not the environment: it must equal the `cluster` of every unit's Kafka
    # trigger in its metadata.json (`local` today). Restate subscribes to kafka://<cluster>/<topic>
    # and refuses a subscription to a cluster name it does not know.
    clusterName: local

# One entry per deployable Restate workflow/service unit. Each becomes one RestateDeployment
# (templates/units/restatedeployment.yaml) that registers itself with core-api on boot. Its Kafka
# triggers come from the image's own metadata.json, not from here.
units:
  transcript:
    enabled: true
    globalImageKey: wf_transcript
    port: 9080
    replicas: 1
    # How long a new version's pods must stay up before the operator registers it.
    minReadySeconds: 30
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    env:
      KNOWLG_BASE_URL: "http://knowlg-service:9000"
      WHISPER_BASE_URL: "http://whisper-service:8000"
      AZURE_STORAGE_ACCOUNT: "{{ (splitList \".\" .Values.global.object_storage_endpoint) | first }}"
      AZURE_STORAGE_CONTAINER: "{{ .Values.global.public_container_name }}"
      AZURE_STORAGE_AUTH_TYPE: "OIDC"
      # @ai-pipeline/ai's generateFromEnv() requires LITELLM_URL and LITELLM_API_KEY (below).
      LITELLM_URL: "http://litellm:4000"
    # Documentation only — nothing in this chart's templates reads units.*.triggers. The real
    # trigger config a unit registers with is baked into its own metadata.json at image build
    # time (self-registered on boot), and metadata.json's topic string is NOT env-templatable —
    # Helm has no reach into an already-built image's JSON. This entry exists only so it's
    # visible here, and must be kept in sync with metadata.json by hand. See README.md open item 2.
    triggers:
      - id: sunbirddev-content-published
        type: kafka
        topic: "{{ .Values.global.env }}.content.published"
    # Env vars read from this chart's Secret (templates/core-api/secret.yaml), as name → key. Kept
    # out of the pod template on purpose: a value written there is readable by anyone who can read
    # the RestateDeployment, and rotating it would change the template hash — a new Restate
    # deployment for every key rotation.
    secretEnv:
      LITELLM_API_KEY: LITELLM_API_KEY

migration:
  # Mirrors migration.yugabyte.waitTime's existing convention in the parent chart.
  waitTime: 120
  # Plain postgres client image — psql speaks YSQL fine since it's wire-compatible. Not routed
  # through images.yaml since it's a stock public image, same treatment as provision/ycql.yaml's
  # own busybox init container.
  image:
    repository: postgres
    tag: "17-alpine"
