# ai-pipeline: Restate-based AI enrichment pipeline. Replaces py-flink's enrichment-router and
# caption-generator jobs. See README.md for the restate-operator prerequisite and open items.

nameOverride: ""
fullnameOverride: ""

# Must equal the restate-operator's CLUSTER_DNS (its default is cluster.local): each unit advertises
# the URL the operator registers for it, and Restate resolves the names core-api hands it from its
# own namespace.
clusterDomain: cluster.local

image:
  pullPolicy: IfNotPresent
  # Not global-values-driven anywhere in this repo (confirmed against every sibling chart) —
  # each chart carries its own, same as py-flink/flink/knowlg/search/sync-tool/janusgraph do.
  pullSecrets: []

commonLabels: {}
commonAnnotations: {}

# The RestateCluster this chart creates. Single-node deliberately, for now (see design doc §5) —
# scaling to a real multi-node cluster later is a `replicas`/`config` addition here, not a rewrite.
restate:
  clusterName: ai-pipeline-restate
  # References global.restate_server in helmcharts/images.yaml, matching every other chart's
  # globalImageKey convention (see py-flink's own `globalImageKey` usage).
  globalImageKey: restate_server
  storageRequestBytes: 2147483648 # 2 GiB to start
  # Labels of the Kafka broker pods in this release's namespace, which Restate's egress policy must
  # reach to consume trigger topics (see templates/restate/restatecluster.yaml).
  kafkaPodLabels:
    app.kubernetes.io/name: kafka

coreApi:
  replicaCount: 1
  globalImageKey: core_api
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # DATABASE_URL points at the shared YugabyteDB YSQL port (global.yugabyte.host/postgresql_port),
  # never a dedicated Postgres — see design doc §2. Reuses the cluster's existing yugabyte
  # superuser rather than a dedicated ai_pipeline role — see
  # scripts/sunbird-yugabyte-migrations/sunbird-knowlg/ai_pipeline_catalogue.sql, which creates
  # only the database, owned by yugabyte, not a new role.
  database:
    name: ai_pipeline_catalogue
    user: yugabyte
    # Real value supplied via opentofu/<provider>/<env>/global-values.yaml, same convention as
    # global.openai_api_key — never committed here. Must match the cluster's real yugabyte
    # superuser password (global.yugabyte.password), not a separate ai_pipeline credential.
    passwordValue: ""
  env:
    # This chart's own litellm Deployment/Service (templates/litellm/), not an external gateway.
    # core-api itself never calls an LLM — this is only read by units.
    litellmUrl: "http://litellm:4000"
  kafka:
    # A name inside Restate, not the environment: it must equal the `cluster` of every unit's Kafka
    # trigger in its metadata.json (`local` today). Restate subscribes to kafka://<cluster>/<topic>
    # and refuses a subscription to a cluster name it does not know.
    clusterName: local

# Model gateway for units that call an LLM (packages/ai's generateFromEnv()). Same shape as
# ai-pipeline's own local dev stack (compose.yaml + infra/litellm/config.yaml) — only the
# upstream provider changes: Azure here, Ollama there. Config, image tag and the
# num_retries: 0 / master_key convention are all copied from that real, working file, not
# reinvented.
litellm:
  globalImageKey: litellm
  service:
    port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # TEST VALUE ONLY — replace with a real generated secret via
  # opentofu/<provider>/<env>/global-values.yaml (same convention as coreApi.database.passwordValue)
  # before this is real production config. This is the "virtual key" units present to this proxy;
  # it is not the real Azure key (that's openai-secret, read directly by this Deployment only).
  masterKeyValue: "sk-litellm-test-master-key"
  model:
    name: chat-default
    # Same Azure OpenAI deployment py-flink's caption-generator already calls successfully
    # (helmcharts/knowledgebb/charts/py-flink/values.yaml) — proven working in this cluster.
    provider: "azure/gpt-5-mini"
    apiBase: "https://cossdev-semanticsearch.openai.azure.com/"
    apiVersion: "2024-12-01-preview"

# Speech-to-text backend for the transcript unit (services/whisper) — CPU-only for now.
whisper:
  globalImageKey: whisper
  service:
    port: 8000
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  model:
    size: small
    device: cpu
    computeType: int8

# One entry per deployable Restate workflow/service unit. Each becomes one RestateDeployment
# (templates/units/restatedeployment.yaml) that registers itself with core-api on boot. Its Kafka
# triggers come from the image's own metadata.json, not from here.
units:
  transcript:
    enabled: true
    globalImageKey: wf_transcript
    port: 9080
    replicas: 1
    # How long a new version's pods must stay up before the operator registers it.
    minReadySeconds: 30
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    env:
      KNOWLG_BASE_URL: "http://knowlg-service:9000"
      WHISPER_BASE_URL: "http://whisper-service:8000"
      AZURE_STORAGE_ACCOUNT: "{{ (splitList \".\" .Values.global.object_storage_endpoint) | first }}"
      AZURE_STORAGE_CONTAINER: "{{ .Values.global.public_container_name }}"
      AZURE_STORAGE_AUTH_TYPE: "OIDC"
      # @ai-pipeline/ai's generateFromEnv() requires LITELLM_URL and LITELLM_API_KEY (below).
      LITELLM_URL: "http://litellm:4000"
    # Kept out of the pod template on purpose: a value written there is readable by anyone who
    # can read the RestateDeployment, and rotating it would change the template hash — a new
    # Restate deployment for every key rotation. This is the litellm proxy's own virtual key
    # (litellm.masterKeyValue above), not the real Azure key — the proxy is the only thing that
    # ever sees openai-secret directly.
    secretEnv:
      - envName: LITELLM_API_KEY
        secretName: "{{ printf \"%s-litellm\" (include \"common.names.fullname\" $) }}"
        secretKey: LITELLM_MASTER_KEY

migration:
  # Mirrors migration.yugabyte.waitTime's existing convention in the parent chart.
  waitTime: 120
  # Plain postgres client image — psql speaks YSQL fine since it's wire-compatible. Not routed
  # through images.yaml since it's a stock public image, same treatment as provision/ycql.yaml's
  # own busybox init container.
  image:
    repository: postgres
    tag: "17-alpine"
