apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-core-api" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  replicas: {{ .Values.coreApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}
      app.kubernetes.io/component: core-api
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: core-api
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: core-api
          image: "{{ (index .Values.global .Values.coreApi.globalImageKey).registry }}/{{ (index .Values.global .Values.coreApi.globalImageKey).repository }}:{{ (index .Values.global .Values.coreApi.globalImageKey).tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.coreApi.service.port }}
          env:
            - name: PORT
              value: {{ .Values.coreApi.service.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            # Confirmed against a real deployed RestateCluster: the operator creates its own
            # dedicated namespace, named identically to the RestateCluster resource itself, with
            # a single Service named plainly `restate` exposing both 9070 (admin) and 8080
            # (ingress) — core-api lives in a different namespace, so this needs the full
            # cross-namespace FQDN, not just the bare Service name.
            - name: RESTATE_ADMIN_URL
              value: {{ printf "http://restate.%s.svc.%s:9070" .Values.restate.clusterName .Values.clusterDomain | quote }}
            - name: RESTATE_INGRESS_URL
              value: {{ printf "http://restate.%s.svc.%s:8080" .Values.restate.clusterName .Values.clusterDomain | quote }}
            # The name core-api registers the Kafka cluster under in Restate — see
            # coreApi.kafka.clusterName for why it is not the environment name.
            - name: KAFKA_CLUSTER_NAME
              value: {{ .Values.coreApi.kafka.clusterName | quote }}
            # Handed to Restate, which resolves it from its own namespace, so a bare Service name
            # (global.kafka.host is `kafka`) is qualified with this release's namespace.
            {{- $kafkaHost := .Values.global.kafka.host }}
            {{- if not (contains "." $kafkaHost) }}
            {{- $kafkaHost = printf "%s.%s.svc.%s" $kafkaHost (include "common.names.namespace" .) .Values.clusterDomain }}
            {{- end }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ printf "%s:%d" $kafkaHost (.Values.global.kafka.port | int) | quote }}
            # core-api only answers Host names on this list (its guard against DNS rebinding; there
            # is no auth). Units call it by its Service name; the probes below send localhost.
            {{- $svc := printf "%s-core-api" (include "common.names.fullname" .) }}
            {{- $ns := include "common.names.namespace" . }}
            - name: ALLOWED_HOSTS
              value: {{ list "localhost" "127.0.0.1" "::1" $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.%s" $svc $ns .Values.clusterDomain) | join "," | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-core-api" (include "common.names.fullname" .) }}
                  key: DATABASE_URL
          resources: {{- toYaml .Values.coreApi.resources | nindent 12 }}
          # The Host header is set because kubelet otherwise sends the pod IP, which ALLOWED_HOSTS
          # refuses with a 403.
          #
          # core-api waits for Postgres and Restate before it listens (up to ~5 minutes), so the
          # startup probe gives it that long before liveness can restart it.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 5
            failureThreshold: 60
          # Postgres and Restate both answering: units can register through it.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 5
          # The process answers; a Restate or Postgres outage must not restart it.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 10
