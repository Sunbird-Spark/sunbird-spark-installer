# Plain Kubernetes Secret, same pattern as ../../../openai-secret.yaml and knowlg's own
# configmap.yaml Secret block — no Vault/External Secrets Operator anywhere in this repo.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-core-api" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s"
                     .Values.coreApi.database.user
                     .Values.coreApi.database.passwordValue
                     .Values.global.yugabyte.host
                     (.Values.global.yugabyte.postgresql_port | int)
                     .Values.coreApi.database.name | b64enc | quote }}
  LITELLM_API_KEY: {{ .Values.coreApi.env.litellmApiKeyValue | b64enc | quote }}
  # Separate key so provision/catalogue-migrate.yaml's Job can source just the password via
  # `PGPASSWORD` (an env var, not manifest text) — see that file's own comment on why.
  DB_PASSWORD: {{ .Values.coreApi.database.passwordValue | b64enc | quote }}
