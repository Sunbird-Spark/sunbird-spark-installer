# Named plainly "whisper-service" (not release-prefixed) — matches
# units.transcript.env.WHISPER_BASE_URL, already wired to http://whisper-service:8000.
apiVersion: v1
kind: Service
metadata:
  name: whisper-service
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: whisper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "common.names.name" . }}
    app.kubernetes.io/component: whisper
  ports:
    - name: http
      port: {{ .Values.whisper.service.port }}
      targetPort: http
