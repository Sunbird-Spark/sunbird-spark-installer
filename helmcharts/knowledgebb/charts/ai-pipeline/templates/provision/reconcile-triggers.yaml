# NOT YET FUNCTIONAL — depends on a core-api endpoint that does not exist yet in the ai-pipeline
# repo (see chart README.md, open item 5). This Job's shape/payload is provisional; finalize both
# sides together once that endpoint is built.
#
# What this is for: the restate-operator (via units/restatedeployment.yaml) registers each unit's
# HTTP endpoint with Restate on its own — but it has no concept of *our* metadata.json-declared
# Kafka triggers. Only core-api knows how to turn a trigger declaration into a real Restate Kafka
# subscription (apps/core-api/src/domain/triggers.ts's reconcileWithin/createSubscription). This
# Job's job is to call a narrow, new core-api endpoint that does just that piece — NOT the full
# registerDeployment() flow, since the operator already registered the endpoint itself; calling
# the full flow again would try to re-register an endpoint Restate already knows about.
#
# Runs after core-api and every unit are applied. It doesn't wait for either to be Ready by watching
# status — it just retries the HTTP call itself (idempotent on core-api's side, same as this
# codebase's other reconcile calls) until the unit shows up as a known Restate service, which
# happens naturally within seconds of the operator finishing its own registration.
{{- range $name, $unit := .Values.units }}
{{- if $unit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-reconcile-triggers-%s" (include "common.names.fullname" $) $name }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: reconcile-triggers
    scope: provisioning
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    # Runs after the units and core-api are applied, but hook ordering alone doesn't mean either
    # is *ready* yet — that's what the retry loop below is for.
    "helm.sh/hook-weight": "10"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: reconcile-triggers
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: reconcile-triggers
          image: "{{ $.Values.reconcileTriggers.image.repository }}:{{ $.Values.reconcileTriggers.image.tag }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CORE_API_URL="http://{{ printf "%s-core-api" (include "common.names.fullname" $) }}:{{ $.Values.coreApi.service.port }}"
              PAYLOAD='{{ dict "name" $name "restateName" $unit.restateName "triggers" $unit.triggers | toJson }}'

              attempt=0
              until curl -sf -X POST "$CORE_API_URL/v1/triggers/reconcile" \
                    -H 'Content-Type: application/json' \
                    -d "$PAYLOAD"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge {{ $.Values.reconcileTriggers.maxAttempts }} ]; then
                  echo "giving up after $attempt attempts: {{ $name }} never became a known Restate service"
                  exit 1
                fi
                echo "attempt $attempt failed (expected until the operator finishes registering {{ $name }} with Restate) — retrying in {{ $.Values.reconcileTriggers.retryDelaySeconds }}s"
                sleep {{ $.Values.reconcileTriggers.retryDelaySeconds }}
              done
              echo "{{ $name }}'s triggers reconciled"
---
{{- end }}
{{- end }}
