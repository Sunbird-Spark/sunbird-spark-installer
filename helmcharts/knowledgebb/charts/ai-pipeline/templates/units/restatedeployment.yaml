{{- range $name, $unit := .Values.units }}
{{- if $unit.enabled }}
{{- $rsdName := printf "%s-%s" (include "common.names.fullname" $) $name }}
# One RestateDeployment per unit. Two things register it with Restate, and they must name the same
# endpoint:
#
#  - the restate-operator registers every version of the pod template at
#    http://<name>-<pod-template-hash>.<namespace>.svc.<clusterDomain>:9080/, a Service it creates
#    per version so a version keeps serving until its in-flight invocations drain. That URL changes
#    whenever the pod template does (image, env, resources…) — the operator's versioning, by design.
#  - the unit posts its own build to core-api on boot (packages/runtime's serve()), which registers
#    ADVERTISED_ENDPOINT with Restate too; it is how the catalogue and the Kafka triggers learn of
#    the build.
#
# So ADVERTISED_ENDPOINT is built at run time from the pod's own `pod-template-hash` label (the
# operator adds it), never written into the template: a literal hash here would change the
# template, and with it the hash. Given the same URL, Restate answers the second registration with
# the first one's deployment id — one deployment, and nothing for the two registrars to fight over.
apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: {{ $rsdName }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $unit.replicas | default 1 }}
  # The operator registers a version once its pods are available. A build core-api refuses
  # (VERSION_*_CONFLICT, SERVICE_MISMATCH, …) exits within seconds of starting, so this keeps it from
  # counting as available — and the operator from routing new invocations to it.
  minReadySeconds: {{ ternary $unit.minReadySeconds 30 (hasKey $unit "minReadySeconds") }}
  restate:
    register:
      cluster: {{ $.Values.restate.clusterName }}
  selector:
    matchLabels:
      app: {{ $rsdName }}
  template:
    metadata:
      labels:
        app: {{ $rsdName }}
        # Same convention as py-flink's own caption-generator/enrichment-router pods, which already
        # touch Azure Blob Storage — this reuses the one cluster-wide federated ServiceAccount rather
        # than creating a new one per unit.
        {{- if and (eq $.Values.global.cloud_storage_provider "azure") $.Values.global.workload_identity_service_account_name }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if $.Values.global.workload_identity_service_account_name }}
      serviceAccountName: {{ $.Values.global.workload_identity_service_account_name }}
      {{- end }}
      {{- if $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ (index $.Values.global $unit.globalImageKey).registry }}/{{ (index $.Values.global $unit.globalImageKey).repository }}:{{ (index $.Values.global $unit.globalImageKey).tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $unit.port | default 9080 }}
              name: restate
          env:
            - name: PORT
              value: {{ $unit.port | default 9080 | quote }}
            # Required by @ai-pipeline/runtime's serve() to self-register with core-api on boot.
            # ARTIFACT_DIGEST is not set here — it's baked into the image at build time
            # (Dockerfile's ARTIFACT_DIGEST build-arg), so it's already a real env var by the time
            # this container starts.
            - name: CORE_API_URL
              value: {{ printf "http://%s-core-api:%d" (include "common.names.fullname" $) (int $.Values.coreApi.service.port) | quote }}
            # The version this pod belongs to, as the operator named it.
            - name: POD_TEMPLATE_HASH
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['pod-template-hash']
            # Exactly the URL the operator registers for this version (port 9080 is the operator's
            # Service port, whatever the container port).
            - name: ADVERTISED_ENDPOINT
              value: {{ printf "http://%s-$(POD_TEMPLATE_HASH).%s.svc.%s:9080/" $rsdName (include "common.names.namespace" $) $.Values.clusterDomain | quote }}
            - name: DEPLOYMENT_MODE
              value: "immutable"
            {{- if and (eq $.Values.global.cloud_storage_provider "azure") $.Values.global.azure_client_id }}
            - name: AZURE_CLIENT_ID
              value: "{{ $.Values.global.azure_client_id }}"
            {{- end }}
            {{- range $key, $value := $unit.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- range $key, $secretKey := $unit.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-core-api" (include "common.names.fullname" $) }}
                  key: {{ $secretKey }}
            {{- end }}
          resources: {{- toYaml $unit.resources | nindent 12 }}
---
{{- end }}
{{- end }}
