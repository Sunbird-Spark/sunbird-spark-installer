{{- range $name, $unit := .Values.units }}
{{- if $unit.enabled }}
# One RestateDeployment per unit — the operator creates the Pods/ReplicaSet/Service itself and
# registers the endpoint with Restate directly. Each unit also self-registers with core-api's
# catalogue on boot (packages/runtime's serve()), which also wires up its Kafka triggers — no
# separate sidecar/Job needed for that anymore.
#
# `restate.register.service` is NOT a way to control this unit's own advertised address — checked
# directly against the CRD's schema: it is one of four mutually exclusive ways to tell the
# operator where Restate's *own* admin API lives (an alternative to `cluster`, not a per-unit
# setting), and setting both errors with a oneOf validation failure. There is no field anywhere in
# this CRD for pinning the unit's own Service name — confirmed by listing every spec field.
apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" $) $name }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $unit.replicas | default 1 }}
  restate:
    register:
      cluster: {{ $.Values.restate.clusterName }}
  selector:
    matchLabels:
      app: {{ printf "%s-%s" (include "common.names.fullname" $) $name }}
  template:
    metadata:
      labels:
        app: {{ printf "%s-%s" (include "common.names.fullname" $) $name }}
    spec:
      {{- if $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ (index $.Values.global $unit.globalImageKey).registry }}/{{ (index $.Values.global $unit.globalImageKey).repository }}:{{ (index $.Values.global $unit.globalImageKey).tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $unit.port | default 9080 }}
              name: restate
          env:
            - name: PORT
              value: {{ $unit.port | default 9080 | quote }}
            # Required by @ai-pipeline/runtime's serve() to self-register with core-api on boot.
            # ARTIFACT_DIGEST is not set here — it's baked into the image at build time
            # (Dockerfile's ARTIFACT_DIGEST build-arg), so it's already a real env var by the time
            # this container starts.
            - name: CORE_API_URL
              value: {{ printf "http://%s-core-api:%d" (include "common.names.fullname" $) (int $.Values.coreApi.service.port) | quote }}
            - name: ADVERTISED_ENDPOINT
              value: {{ printf "http://%s-%s:%d" (include "common.names.fullname" $) $name (int ($unit.port | default 9080)) | quote }}
            - name: DEPLOYMENT_MODE
              value: "immutable"
            {{- range $key, $value := $unit.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
          resources: {{- toYaml $unit.resources | nindent 12 }}
---
{{- end }}
{{- end }}
