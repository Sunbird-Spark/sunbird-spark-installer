# The proxy's own virtual key — what units present to authenticate to litellm, never the real
# Azure key (that's openai-secret, read only by the litellm Deployment itself).
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-litellm" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: litellm
type: Opaque
data:
  LITELLM_MASTER_KEY: {{ .Values.litellm.masterKeyValue | b64enc | quote }}
