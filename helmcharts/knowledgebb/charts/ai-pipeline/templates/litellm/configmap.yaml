# Same shape as ai-pipeline's own local dev config (infra/litellm/config.yaml) — only the
# upstream provider changes (Azure here, Ollama there). num_retries: 0 is deliberate: Restate's
# own ctx.run retry profiles are the single retry authority, not LiteLLM's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-litellm" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: litellm
data:
  config.yaml: |
    model_list:
      - model_name: {{ .Values.litellm.model.name }}
        litellm_params:
          model: {{ .Values.litellm.model.provider | quote }}
          api_base: {{ .Values.litellm.model.apiBase | quote }}
          api_version: {{ .Values.litellm.model.apiVersion | quote }}
          api_key: os.environ/OPENAI_API_KEY
    litellm_settings:
      telemetry: false
      drop_params: false
      request_timeout: 180
      num_retries: 0
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_spend_logs: true
