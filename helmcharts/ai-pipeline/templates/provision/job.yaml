# Creates core-api's catalogue database + tables (files/ai_pipeline_catalogue.sql) — idempotent,
# re-runnable (IF NOT EXISTS throughout; \gexec guards the CREATE DATABASE itself). Runs as a
# pre-install/pre-upgrade hook so the tables exist before core-api's own Deployment starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-catalogue-migration
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
    spec:
      restartPolicy: Never
      # No kubectl/K8s-API calls in this job -- YSQL only.
      automountServiceAccountToken: false
      volumes:
        - name: sql
          configMap:
            name: {{ include "common.names.fullname" . }}-catalogue-migration
      {{- $yugabyteHost := .Values.global.yugabyte.host }}
      {{- if not (contains "." $yugabyteHost) }}
      {{- $yugabyteHost = printf "%s.%s.svc.%s" $yugabyteHost .Values.global.yugabyteNamespace .Values.global.clusterDomain }}
      {{- end }}
      initContainers:
        - name: wait-for-yugabyte
          image: busybox
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          command: ['/bin/sh', '-c']
          args:
            - "timeout {{ .Values.migration.waitTime }} sh -c 'until nc -z {{ $yugabyteHost }} {{ .Values.global.yugabyte.postgresql_port }}; do echo waiting for yugabyte; sleep 10; done'"
      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi, ephemeral-storage: 512Mi }
          env:
            - name: PGHOST
              value: {{ $yugabyteHost | quote }}
            - name: PGPORT
              value: {{ .Values.global.yugabyte.postgresql_port | quote }}
            - name: PGUSER
              value: {{ .Values.global.yugabyte.ysql.user | quote }}
            - name: PGPASSWORD
              value: {{ .Values.global.yugabyte.ysql.password | quote }}
          command: ['psql', '-f', '/opt/migrations/ai_pipeline_catalogue.sql']
          volumeMounts:
            - name: sql
              mountPath: /opt/migrations
