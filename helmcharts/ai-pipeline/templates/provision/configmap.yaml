apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-catalogue-migration
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  annotations:
    # Must run (and be created) before the migration Job's own pre-install,pre-upgrade hook, which
    # mounts this ConfigMap — otherwise Helm creates it as a normal resource, after hooks run.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  ai_pipeline_catalogue.sql: |
{{ .Files.Get "files/ai_pipeline_catalogue.sql" | indent 4 }}
