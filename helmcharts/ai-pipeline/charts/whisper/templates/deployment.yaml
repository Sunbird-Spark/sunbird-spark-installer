# Plain FastAPI + faster-whisper, no auth, CPU-only for now — a GPU node pool would be a
# nodeSelector/tolerations addition here later, not a rewrite.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: whisper
          image: "{{ (index .Values.global .Values.globalImageKey).registry }}/{{ (index .Values.global .Values.globalImageKey).repository }}:{{ (index .Values.global .Values.globalImageKey).tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: WHISPER_MODEL_SIZE
              value: {{ .Values.model.size | quote }}
            - name: WHISPER_DEVICE
              value: {{ .Values.model.device | quote }}
            - name: WHISPER_COMPUTE_TYPE
              value: {{ .Values.model.computeType | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # model.transcribe() blocks the event loop for the whole request — /health can't answer
          # mid-transcription, so probes need enough tolerance not to kill the pod for that.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 12
