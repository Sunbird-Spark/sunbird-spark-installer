PORT: {{ .Values.service.port | quote }}
HOST: "0.0.0.0"
# The operator creates its own namespace, named identically to the RestateCluster,
# with a single Service named plainly `restate` exposing 9070 (admin) and 8080
# (ingress). Same namespace as core-api under the current layout, but the FQDN still
# resolves correctly either way.
RESTATE_ADMIN_URL: {{ printf "http://restate.%s.svc.%s:9070" .Values.global.restateClusterName .Values.global.clusterDomain | quote }}
RESTATE_INGRESS_URL: {{ printf "http://restate.%s.svc.%s:8080" .Values.global.restateClusterName .Values.global.clusterDomain | quote }}
KAFKA_CLUSTER_NAME: {{ .Values.kafka.clusterName | quote }}
# core-api's app code always prepends this to a unit's declared topic before subscribing, so the
# topic name itself (in metadata.json, hashed into the unit's artifact digest) stays the same
# across environments — only this value differs per environment, same role as KAFKA_CLUSTER_NAME.
{{- if .Values.global.env }}
KAFKA_TOPIC_PREFIX: {{ printf "%s." .Values.global.env | quote }}
{{- else }}
KAFKA_TOPIC_PREFIX: ""
{{- end }}
# Handed to Restate, which resolves it from its own namespace, so a bare Service name
# (global.kafka.host is `kafka`) is qualified with Kafka's own namespace (global.kafkaNamespace,
# e.g. `sunbird`) — not this release's namespace, which is a different one.
{{- $kafkaHost := include "ai-pipeline.qualifyHost" (dict "host" .Values.global.kafka.host "namespace" .Values.global.kafkaNamespace "domain" .Values.global.clusterDomain) }}
KAFKA_BOOTSTRAP_SERVERS: {{ printf "%s:%d" $kafkaHost (.Values.global.kafka.port | int) | quote }}
# core-api only answers Host names on this list (its guard against DNS rebinding; there
# is no auth). Units call it by its Service name; the probes below send localhost.
{{- $svc := include "common.names.fullname" . }}
{{- $ns := include "common.names.namespace" . }}
ALLOWED_HOSTS: {{ list "localhost" "127.0.0.1" "::1" $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.%s" $svc $ns .Values.global.clusterDomain) | join "," | quote }}
