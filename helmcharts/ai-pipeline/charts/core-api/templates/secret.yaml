# Plain Kubernetes Secret, same pattern as knowlg's own Secret block — no Vault/External Secrets
# Operator anywhere in this repo.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s"
                     .Values.global.yugabyte.user
                     .Values.global.yugabyte.password
                     .Values.global.yugabyte.host
                     (.Values.global.yugabyte.postgresql_port | int)
                     .Values.database.name | b64enc | quote }}
