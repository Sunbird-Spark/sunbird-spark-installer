apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: {{ .Values.model.name }}
        litellm_params:
          model: {{ .Values.model.provider | quote }}
          api_base: {{ .Values.model.apiBase | quote }}
          api_version: {{ .Values.model.apiVersion | quote }}
          api_key: os.environ/OPENAI_API_KEY
    litellm_settings:
      telemetry: false
      # gpt-5-mini is a reasoning model and rejects temperature=0 unless unsupported params are dropped.
      drop_params: true
      request_timeout: 180
      # Restate's own retry profiles are the single retry authority, not LiteLLM's.
      num_retries: 0
    general_settings:
      disable_spend_logs: true
