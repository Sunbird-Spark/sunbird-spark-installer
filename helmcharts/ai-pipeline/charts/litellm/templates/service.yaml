# Named plainly "litellm" (not release-prefixed) — matches http://litellm:4000, already wired
# into units.transcript.env.LITELLM_URL and ai-pipeline's own local dev compose.yaml.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "common.names.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
