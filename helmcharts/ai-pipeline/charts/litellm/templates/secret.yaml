# Own copy of the Azure key, not a cross-reference to knowledgebb's openai-secret (Secrets don't
# resolve across namespaces). Same source value (global.openai_api_key), rendered independently.
{{- if .Values.global.openai_api_key }}
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  OPENAI_API_KEY: {{ .Values.global.openai_api_key | b64enc | quote }}
{{- end }}
