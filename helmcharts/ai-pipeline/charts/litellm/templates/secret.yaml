# Own copy of the Azure key, not a cross-reference to knowledgebb's openai-secret (Secrets don't
# resolve across namespaces). Same source value (global.openai_api_key), rendered independently.
#
# Required, not conditional: deployment.yaml's envFrom references this Secret unconditionally, so
# a missing key must fail at install time, not surface as a pod CreateContainerConfigError later.
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  OPENAI_API_KEY: {{ required "global.openai_api_key is required for litellm" .Values.global.openai_api_key | b64enc | quote }}
