# You can add key value pair here, to create env values.
YUGABYTE_HOST: "{{ (include "sunbird.yugabyte" (list $ "host")) }}"
YUGABYTE_PORT: "{{ (include "sunbird.yugabyte" (list $ "postgresql_port")) }}"
YUGABYTE_DB: "{{ .Values.POSTGRES_DB }}"
YUGABYTE_USER: "{{ (include "sunbird.yugabyte" (list $ "username")) }}"
KEYCLOAK_URL: "{{ .Values.KEYCLOAK_URL }}"
KEYCLOAK_PORT: "{{ .Values.KEYCLOAK_PORT }}"
KEYCLOAK_REALM: "{{ .Values.KEYCLOAK_REALM }}"
KEYCLOAK_ADMIN_USERNAME: "{{ .Values.KEYCLOAK_ADMIN_USERNAME }}"
NAMESPACE: "{{ .Release.Namespace }}"
YUGABYTE_PASSWORD: "{{ (include "sunbird.yugabyte" (list $ "password")) }}"
{{- if include "sunbird.yugabyteTLS" . }}
PGSSLMODE: "{{ include "sunbird.yugabyteSSLMode" . }}"
PGSSLROOTCERT: "{{ include "sunbird.yugabyteCAFile" . }}"
{{- end }}