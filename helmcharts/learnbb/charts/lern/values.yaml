fullnameOverride: "lern"

replicaCount: 1

image:
  repository: ghcr.io/sunbird-lern/lern-service
  tag: "spark-v0.3_bfff86f_6"
  pullPolicy: IfNotPresent
  pullSecrets: []

podAnnotations: {}

podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1001
  # fsGroup: 1001

securityContext: {}
  # readOnlyRootFilesystem: false
  # capabilities:
  #   drop:
  #   - ALL

service:
  type: ClusterIP
  protocol: TCP
  ports:
    - name: http
      port: 9000
      targetPort: 9000

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    cpu: 1
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1
  httpGet:
    path: /health
    port: 9000

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
  httpGet:
    path: /health
    port: 9000

nodeSelector: {}
tolerations: []
# Benchmark tuning: at most one lern pod per node (lern is CPU-bound; two on
# one node starve each other). Replicas are therefore capped by node count.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: lern

configmap:
  enabled: true
  mountPath: /home/sunbird/lern-service-impl-1.0-SNAPSHOT/conf

commonAnnotations:
  reloader.stakater.com/auto: "true"

serviceAccount:
  create: false

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: monitoring
  honorLabels: true
  jobLabel: "app.kubernetes.io/name"

# Common App Settings
bind_hostname: "0.0.0.0"
sunbird_cassandra_keyspace: "sunbird"
sunbird_app_name: "sunbird"
sunbird_sso_username: admin
sunbird_sso_password: admin
keycloak_realm: sunbird
sunbird_sso_client_id: lms
sunbird_sso_client_secret: "lms"
actor_hostname: actor-service
sunbird_quartz_mode: cluster
sunbird_encryption_mode: local
sunbird_remote_req_router_path: pekko.tcp://SunbirdMWSystem@actor-service:8088/user/RequestRouter
sunbird_remote_bg_req_router_path: kka.tcp://SunbirdMWSystem@actor-service:8088/user/BackgroundRequestRouter
sunbird_default_channel: "sunbird"
sunbird_user_bulk_upload_size: "1001"
sunbird_otp_allowed_attempt: "5"
feed_limit: "30"
form_api_endpoint: "/plugin/v1/form/read"
userorg_in_memory_cache_ttl: "600"
user_index_alias: "user_alias"
org_index_alias: "org_alias"
sunbird_reset_pass_msg: "You have requested to reset password. Click on the link to set a password:"
sunbird_mw_system_host: "localhost"
sunbird_mw_system_port: 8088
telemetry_queue_threshold_value: "100"
sunbird_cs_search_path: "/v1/content/search"
sunbird_registry_service_baseurl: "http://registry-service:8081"
sunbird_time_zone: "Asia/Kolkata"
sunbird_otp_length: 6
sunbird_otp_expiration: 1800
sunbird_course_batch_notification_signature: sunbird
sunbird_course_batch_notification_enabled: true
sunbird_user_profile_field_default_visibility: private
sunbird_email_max_recipients_limit: 100
sunbird_url_shortner_enable: false
sunbird_password_reset_login_page_url:  "/password-reset-success"
telemetry_pdata_pid: lern-service
api_actor_provider: local
background_actor_provider: local
sunbird_health_check_enable: "true"
sunbird_keycloak_user_federation_provider_id: "cassandrafederationid"
sunbird_gzip_enable: "true"
sunbird_gzip_size_threshold: "262144"
sunbird_cache_enable: "false"
keys_basepath: "/keys/"
PORTAL_SERVICE_PORT: "http://player:3000"
sunbird_installation_display_name_for_sms: "Sunbird"
isMultiDCEnabled: "false"
# JVM options are set with java_options (see "Benchmark tuning" below);
# env.yaml renders JAVA_OPTIONS from that key, not from here.
_JAVA_OPTIONS: "-Dlog4j2.formatMsgNoLookups=true"
enable_captcha: "false"
user-deletion-broadcast-topic: "local.delete.user"

# LMS Specific
sunbird_user_search_cretordetails_fields: "id,firstName,lastName"
limit_managed_user_creation: "true"
managed_user_limit: "30"
sunbird_user_qrcode_courses_limit: "5000"
learning_content_props_to_add: "mimeType,contentType,name,code,description,keywords,framework,copyright,topic"
group_activity_agg_cache_ttl: "3600"
group_activity_agg_cache_enable: "false"
redis_enabled: false
redis_connection_max: "64"
redis_connection_idle_max: "32"
redis_connection_idle_min: "1"
redis_connection_minEvictableIdleTimeSeconds: "120"
redis_connection_timeBetweenEvictionRunsSeconds: "300"
redis_experimentIndex: "10"
redis_dbIndex: "2"
redis_relation_cache_index: "10"
dedup_redis_index: "13"
dedup_redis_expiry: "604800"
user_enrolments_response_cache_enable: "false"
frameworkvalidation: "false"
user_enrolments_response_cache_ttl: "300"
collection_summary_agg_data_source: 'audit-rollup-syncts'
collection_summary_agg_cache_ttl: "21600"
enrollment_list_size: "1000"
hierarchy_store_keyspace: "_hierarchy_store"
hierarchy_relations_table: "hierarchy_relations"
cloud_storage_path_prefix_dial: "dial"
cloud_store_base_path_placeholder: ""
sunbird_dial_service_search_url: "/dialcode/v3/search"
learner_in_memory_cache_ttl: "300"

enable_activity_aggregator_actor: "true"
enable_module_aggregation: "true"
sunbird_course_keyspace: "sunbird_courses"
activity_input_dedup_enabled: "false"
filter_processed_enrolments: "true"
assessment_direct_aggregation_enabled: "true"

# Viewer Specific
viewer_enabled: "true"
deployment_mode: "monolith"
viewer_summary_upload_path: "viewer-summary"
viewer_context_mode: "strict"
viewer_carry_scope: "content"
viewer_carry_forward_rules: ''

# Notification Specific
sunbird_cassandra_notification_keyspace: sunbird_notifications

# Yugabytesql Values
sunbird_postgres_db: "sunbird"

# Benchmark tuning: HTTP connection pool to downstream services
unirest_max_total_connections: "400"
unirest_max_connections_per_route: "200"
# Read by lern-service PR #70 (perf/lern-update-path); ignored by older images
viewer_aggregation_debounce_ms: "2000"
course_batch_cache_ttl_seconds: "60"

# Rendered into lern-env as JAVA_OPTIONS. Actor/dispatcher sizing must be set
# here: the image never reads the mounted application.conf. -Dlogger.file
# points at the mounted (quiet, root WARN) configs/logback.xml.
java_options: >-
  -XX:MaxRAMPercentage=40
  -Dpekko.actor.deployment./content-consumption-actor.nr-of-instances=48
  -Dpekko.actor.deployment./content-consumption-actor/*.dispatcher=pekko.actor.tracking-dispatcher
  -Dpekko.actor.deployment./view-consumption-actor.nr-of-instances=48
  -Dpekko.actor.deployment./view-consumption-actor/*.dispatcher=pekko.actor.viewer-dispatcher
  -Dpekko.actor.deployment./course-enrolment-actor.nr-of-instances=32
  -Dpekko.actor.deployment./course-enrolment-actor/*.dispatcher=pekko.actor.tracking-dispatcher
  -Dpekko.actor.tracking-dispatcher.fork-join-executor.parallelism-max=128
  -Dpekko.actor.deployment./course-batch-management-actor.nr-of-instances=32
  -Dpekko.actor.deployment./course-batch-management-actor/*.dispatcher=pekko.actor.rr-dispatcher
  -Dlogger.file=/home/sunbird/lern-service-impl-1.0-SNAPSHOT/conf/logback.xml

# OPA / Envoy
opa_enabled: false

envoy_probes:
  failureThreshold: 2
  httpGet:
    path: /ready
    port: 10000
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5

opa_probes:
  failureThreshold: 3
  httpGet:
    path: /health?plugins
    port: 8282
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5

envoy_resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

opa_resources:
  requests:
    cpu: "1500m"
    memory: "100Mi"
  limits:
    cpu: "4"
    memory: "1Gi"

init_container_resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "1"
    memory: "1024Mi"

global:
  keycloak_kid_keys_configmap: keycloak-kids-keys
  keycloak_key_configmap: keycloak-key
  kong_desktop_device_consumer_names_for_opa: '["portal", "desktop"]'

# Envoy worker threads; match the envoy CPU limit
envoy_concurrency: 2

# Go runtime for OPA: GOMAXPROCS = OPA CPU limit, GOGC=200 trades memory for less GC CPU
opa_env:
  GOMAXPROCS: "4"
  GOGC: "200"

opa_render_resources:
  requests:
    cpu: "10m"
    memory: "16Mi"
  limits:
    cpu: "200m"
    memory: "64Mi"

envoy_image:
  registry: "docker.io"
  repository: "envoyproxy/envoy"
  tag: "v1.20.0"

opa_image:
  registry: "docker.io"
  repository: "openpolicyagent/opa"
  tag: "1.22.3-envoy@sha256:6ce6563695665a4c06338832e0a532c4dbf16f7beea05386ad0a6eb91d9e8593"

proxy_init_image:
  registry: "docker.io"
  repository: "openpolicyagent/proxy_init"
  tag: "v5"

# Renders the OPA policies + Keycloak key before OPA starts (see deployment.yaml)
opa_render_image:
  registry: "docker.io"
  repository: "library/busybox"
  tag: "1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
topologySpreadConstraints: []
