cert_service_base_url: "{{ .Values.cert_service_base_url }}"
registry_credential_service_base_url: "{{ .Values.registry_credential_service_base_url }}"
rc_entity: "{{ .Values.rc_entity }}"
sunbird_es_host: "{{ .Values.global.opensearch.host }}"
sunbird_es_port: "{{ .Values.global.opensearch.port }}"
sunbird_cassandra_keyspace: "{{ .Values.sunbird_cassandra_keyspace }}"
{{- if include "sunbird.yugabyteManaged" $ }}
sunbird_cassandra_username: "{{ include "sunbird.yugabyte" (list $ "username") }}"
sunbird_cassandra_password: "{{ include "sunbird.yugabyte" (list $ "password") }}"
{{- else }}
sunbird_cassandra_username: "{{ .Values.sunbird_cassandra_username }}"
sunbird_cassandra_password: "{{ .Values.sunbird_cassandra_password }}"
{{- end }}
{{- if include "sunbird.yugabyteTLS" $ }}
sunbird_cassandra_ssl_enabled: "true"
sunbird_cassandra_sslrootcert: "{{ include "sunbird.yugabyteCAFile" $ }}"
{{- end }}
sunbird_cassandra_host: "{{ (include "sunbird.yugabyte" (list $ "host")) }}"
sunbird_cassandra_port: "{{ (include "sunbird.yugabyte" (list $ "port")) }}"
isMultiDCEnabled: "{{ .Values.cassandra_multi_dc_enabled }}"
JAVA_OPTIONS: "{{ .Values.java_options }}"