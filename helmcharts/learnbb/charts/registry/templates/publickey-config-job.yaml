apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-publickey-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: publickey-config
          image: {{ .Values.publickeyConfig.image | default "curlimages/curl:latest" }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              CERTKEY=$(curl -s --location --request POST "http://{{ include "common.names.fullname" . }}-service:8081/api/v1/PublicKey/search" \
                --header 'Content-Type: application/json' --data-raw '{ "filters": {}}' | grep -o '"value":"[^"]*"' || true)
              if [ -z "$CERTKEY" ]; then
                echo "Certificate RSA public key not available — registering"
                curl --location --request POST "http://{{ include "common.names.fullname" . }}-service:8081/api/v1/PublicKey" \
                  --header 'Content-Type: application/json' \
                  --data-raw "{\"value\":\"${CERTIFICATE_PUBLIC_KEY}\"}"
              else
                echo "Certificate RSA public key already registered — skipping"
              fi
          env:
            - name: CERTIFICATE_PUBLIC_KEY
              value: "{{ .Values.global.CERTIFICATE_PUBLIC_KEY }}"
