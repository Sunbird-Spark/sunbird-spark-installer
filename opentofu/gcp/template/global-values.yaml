deployed_dial_addon:  &deployed_dial_addon  "false"
enable_asset_enrichment: &enable_asset_enrichment "false"
default_passwords:
  grafana_admin_password: &grafana-admin-password "prom-operator"
  superset_admin_password: &superset-admin-password "admin"
  keycloak_password: &keycloak-password "admin"
  opensearch_admin_password: &opensearch-admin-password "REPLACE_WITH_OPENSEARCH_ADMIN_PASSWORD"
kube-prometheus-stack:
  grafana:
    adminUser: admin
    adminPassword: *grafana-admin-password
keycloak:
  keycloak_user: admin
  keycloak_password: *keycloak-password
keycloak-kids-keys:
  KEYCLOAK_ADMIN_PASSWORD: *keycloak-password
opensearch:
  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      value: *opensearch-admin-password
# ── cert-manager (automated TLS issuance/renewal) ───────────────────────────
# Both must be true together with global.cert_manager_ssl: true below for
# automated TLS to actually take effect. Leave both false (default) if
# providing your own cert/key via proxy_certificate/proxy_private_key instead.
cert-manager:
  enabled: false
ingress-nginx:
  enabled: false
global:
  building_block: "" 
  env: "" 
  environment: "" # environment name
  release_version: "release-7.0.0"
  # Cluster-level variables for GKE setup and networking
  gke_node_pool_instance_type: "n2d-standard-16"
  create_network: "true"
  gke_node_default_disk_size_gb: 100
  object_storage_endpoint: storage.googleapis.com
  checkpoint_store_type: "gcs"
  cloud_storage_provider: "gcp"
  cloud_service_provider: "google"
  sunbird_cloud_storage_provider: "gcloud"
  cloud_storage_region: ""
  zone: ""
  cloud_storage_project: ""
  # Provide your domain name
  # Example: sunbird.com
  domain: "REPLACE_ME"
  # Set to true for fully automated TLS issuance + renewal via cert-manager
  # (no manual DNS-01/TXT record, no pasting cert/key below into
  # proxy_certificate/proxy_private_key -- ever, not even the first time).
  # Also requires cert-manager.enabled: true and ingress-nginx.enabled: true
  # above (top of this file). Leave all three false (default) to provide
  # your own cert/key via proxy_certificate/proxy_private_key below instead.
  cert_manager_ssl: false
  # cert_manager_acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory"
  # ^ uncomment to issue against Let's Encrypt's staging directory instead of
  # production while debugging a new domain -- staging isn't rate-limited
  # the way production is (5 failed validations/hour, 5 duplicate certs/week
  # per hostname), so it's much safer to iterate against. Defaults to
  # production when unset.
  cert_notifications:
    email: "" # provide the email address for certificate renewal notifications/alerts
  play_http:
     secret_key: "a-long-secret-to-calm-the-rage-of-the-entropy-gods-hidden-deep-within-the-silent-ruins-of-forgotten-realms" 
    # cloud_private_storage_secret: "{{ .Values.global.gcp_storage_account_key | default "gcp-credentials"}}"
  # Provide values for the following variables
  sunbird_google_captcha_site_key: 
  google_captcha_private_key: 
  sunbird_google_oauth_clientId: 
  sunbird_google_oauth_clientSecret: 
  mail_server_from_email: ""
  mail_server_password: ""
  mail_server_host: smtp.sendgrid.net
  mail_server_port: "587"
  mail_server_username: apikey
  sunbird_msg_91_auth: ""
  sunbird_msg_sender: ""
  youtube_apikey: ""
  openai_api_key: "REPLACE_WITH_OPENAI_API_KEY"
  openai_model: "text-embedding-3-small"  # used by both search's semantic query path and flink's content-embedding job -- must match, or query-time and index-time vectors won't share a space
  superset:
      init:
        adminUser:
          username: admin
          password: *superset-admin-password  
  yugabyte:
    ysql:
      user: "yugabyte"  
      password: "yugabyte" 
  keycloak:
   keycloak_user: admin
   keycloak_password: *keycloak-password  
  deployed_dial_addon: *deployed_dial_addon
  enable_asset_enrichment: *enable_asset_enrichment

  # The merge domain is optional and is required only if user merge workflow is required.
  # For most audience, this workflow is not required. If you need this workflow, then
  # set the value of merge_domain_status to "true" and provide a subdomain / another domain
  merge_domain_status: "false"
  merge_domain: ""
  # Add the domain SSL key and certificate
  # Not needed at all if cert_manager_ssl is true above -- cert-manager owns
  # the TLS Secret directly, no static value here, ever (not even first-time).
  # Example below:
  # proxy_private_key: |
  #   -----BEGIN PRIVATE KEY-----
  #   <your base64-encoded private key contents>
  #   -----END PRIVATE KEY-----
  # proxy_certificate: |
  #   -----BEGIN CERTIFICATE-----
  #   <your base64-encoded certificate contents>
  #   -----END CERTIFICATE-----
  proxy_private_key: |
    REPLACE_ME
  proxy_certificate: |
    REPLACE_ME
  # CERTIFICATE-KEYS 