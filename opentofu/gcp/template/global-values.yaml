deployed_dial_addon:  &deployed_dial_addon  "false"
enable_asset_enrichment: &enable_asset_enrichment "false"
default_passwords:
  grafana_admin_password: &grafana-admin-password "prom-operator"
  superset_admin_password: &superset-admin-password "admin"
  keycloak_password: &keycloak-password "admin"
kube-prometheus-stack:
  grafana:
    adminUser: admin
    adminPassword: *grafana-admin-password
keycloak:
  keycloak_user: admin
  keycloak_password: *keycloak-password
keycloak-kids-keys:
  KEYCLOAK_ADMIN_PASSWORD: *keycloak-password
# ── Sync Tool (on-demand JanusGraph → OpenSearch sync) ──────────────────────
# NOT deployed during normal install.
# To run: set enabled: true + syncMode below, then deploy via:
#   ./install.sh install_service knowledgebb sync-tool
# Or in GitHub Actions: check knowledgebb + type "sync-tool" in specific_charts
sync-tool:
  enabled: false
  syncMode: full     # full | objectType | identifiers | days | file
  objectType: ""     # used when syncMode=objectType (e.g. "Content")
  identifiers: ""    # used when syncMode=identifiers (e.g. "do_123,do_456")
  days: ""           # used when syncMode=days (e.g. "5")

global:
  skip_storage_module: false  # set to true to reuse buckets from an existing global-cloud-values.yaml; false creates new buckets
  create_network: "true"  # true = network module creates the VPC/subnetwork; false = reuse an existing one (set network/subnetwork below — e.g. pre-created by gcp-setup-installer-vm.sh so the runner VM shares GKE's VPC)
  network: ""        # required when create_network: false — name of existing VPC (e.g. "ed-dev-network")
  subnetwork: ""      # required when create_network: false — name of existing public subnetwork (e.g. "ed-dev-subnetwork-public")
  enable_private_gke_nodes: true    # true = GKE nodes get internal IPs only; false = nodes get public IPs too
  disable_public_gke_endpoint: true # true = GKE API server is private (requires being inside the VPC, e.g. via the runner VM's VPN/IAP access); false = GKE API server is public
  master_ipv4_cidr_block: "10.2.0.0/28" # required by GCP whenever enable_private_gke_nodes is true — must not overlap the subnetwork's primary (10.0.0.0/20) or secondary (10.1.0.0/20, 10.1.32.0/20) ranges
  sunbird_player_editor_ref: "master"  # git branch or tag for sunbird-content-plugins, sunbird-content-editor, sunbird-generic-editor, sunbird-content-player
  knowledge_platform_ref: "master"  # git branch or tag for knowledge-platform (schemas/local upload)
  building_block: ""
  env: ""
  environment: "" # environment name
  release_version: "release-7.0.0"
  # Cluster-level variables for GKE setup and networking
  gke_node_pool_instance_type: "n2d-standard-16"
  gke_node_default_disk_size_gb: 100
  object_storage_endpoint: storage.googleapis.com
  checkpoint_store_type: "gcs"
  cloud_storage_provider: "gcp"
  cloud_service_provider: "google"
  sunbird_cloud_storage_provider: "gcloud"
  cloud_storage_region: ""
  zone: ""
  cloud_storage_project: ""
  # Provide your domain name
  # Example: sunbird.com
  domain: "REPLACE_ME"
  lets_encrypt_ssl: false #enable this if you are using  let's encrypt ssl certificate
  cert_notifications:
    email: "" # provide the email address for certificate renewal notifications/alerts
  play_http:
     secret_key: "a-long-secret-to-calm-the-rage-of-the-entropy-gods-hidden-deep-within-the-silent-ruins-of-forgotten-realms"
  # Provide values for the following variables
  sunbird_google_captcha_site_key: 
  google_captcha_private_key: 
  sunbird_google_oauth_clientId: 
  sunbird_google_oauth_clientSecret: 
  mail_server_from_email: ""
  mail_server_password: ""
  mail_server_host: smtp.sendgrid.net
  mail_server_port: "587"
  mail_server_username: apikey
  sunbird_msg_91_auth: ""
  sunbird_msg_sender: ""
  mail_from_certbot_notifications: ""  #The "from" email address used by the Certbot renewal job for sending SSL renewal status notifications via SendGrid SMTP
  # openai_azure_endpoint/openai_azure_deployment/openai_azure_api_version are
  # Azure OpenAI Service-specific (see opentofu/azure/template/global-values.yaml)
  # and intentionally omitted here — the embedding job falls back to plain
  # OpenAI when they're unset, which is what a GCP deployment wants.
  openai_api_key: "REPLACE_WITH_OPENAI_API_KEY"
  openai_model: "text-embedding-3-small"  # used by both search's semantic query path and flink's content-embedding job -- must match, or query-time and index-time vectors won't share a space
  superset:
      init:
        adminUser:
          username: admin
          password: *superset-admin-password  
  yugabyte:
    ysql:
      user: "yugabyte"  
      password: "yugabyte" 
  keycloak:
   keycloak_user: admin
   keycloak_password: *keycloak-password  
  deployed_dial_addon: *deployed_dial_addon
  enable_asset_enrichment: *enable_asset_enrichment

  # The merge domain is optional and is required only if user merge workflow is required.
  # For most audience, this workflow is not required. If you need this workflow, then
  # set the value of merge_domain_status to "true" and provide a subdomain / another domain
  merge_domain_status: "false"
  merge_domain: ""
  # Add the domain SSL key and certificate
  # Example below:
  # proxy_private_key: |
  #   -----BEGIN PRIVATE KEY-----
  #   <your base64-encoded private key contents>
  #   -----END PRIVATE KEY-----
  # proxy_certificate: |
  #   -----BEGIN CERTIFICATE-----
  #   <your base64-encoded certificate contents>
  #   -----END CERTIFICATE-----
  proxy_private_key: |
    REPLACE_ME
  proxy_certificate: |
    REPLACE_ME
  # CERTIFICATE-KEYS 